<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>时间景观</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05080f;font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#c8daf0;-webkit-font-smoothing:antialiased}

/* ===== 底图 ===== */
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;pointer-events:none;transition:opacity .4s}
#gl.show{opacity:1;pointer-events:none}

/* ===== 顶部栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;height:44px;background:linear-gradient(180deg,rgba(5,8,15,.92),transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{font-size:16px;font-weight:800;color:#eaf6ff;text-shadow:0 0 12px rgba(95,214,240,.5)}
.brand sub{font-size:9px;color:#5fd6f0;margin-left:4px;letter-spacing:1px;vertical-align:baseline}
.view-seg{display:flex;margin-left:auto;gap:2px}
.view-seg button{background:rgba(95,214,240,.08);border:1px solid rgba(95,214,240,.25);color:#6a8ea8;font-size:11px;padding:3px 10px;border-radius:12px;cursor:pointer;font-weight:600}
.view-seg button.on{background:linear-gradient(135deg,#5fd6f0,#2aa9c8);color:#04121c;border-color:transparent}
.menu-btn{width:32px;height:32px;border:1px solid rgba(95,214,240,.3);border-radius:4px;background:rgba(8,20,36,.7);color:#5fd6f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:8px}

/* ===== 地球信息条 ===== */
.einfo{position:fixed;top:44px;left:12px;z-index:15;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.einfo .ei1{font-size:12px;font-weight:700;color:#eaf6ff;text-shadow:0 0 8px rgba(0,0,0,.8)}
.einfo .ei2{font-size:11px;color:#ffd24a;text-shadow:0 0 6px rgba(0,0,0,.8)}
.einfo .ei3{font-size:10px;color:#ffe08a;line-height:1.3;text-shadow:0 0 6px rgba(0,0,0,.8)}

/* ===== 右侧菜单按钮 ===== */
.rail{position:fixed;right:10px;top:54px;z-index:20;display:flex;flex-direction:column;gap:8px}
.rbtn{width:38px;height:38px;border-radius:4px;border:1px solid rgba(95,214,240,.3);background:rgba(8,20,36,.7);color:#4d6a80;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;pointer-events:auto}
.rbtn.on{color:#5fd6f0;box-shadow:inset 0 0 10px rgba(95,214,240,.12)}
.rbtn.menu-btn{color:#5fd6f0;font-size:18px;font-weight:700}

/* ===== 底部控制台 ===== */
.console{position:fixed;left:8px;right:8px;bottom:0;z-index:20;padding:24px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(8,20,36,.82);border:1px solid rgba(95,214,240,.28);border-radius:9px 9px 0 0;backdrop-filter:blur(10px);transition:transform .3s}
.console.hide{transform:translateY(100%)}
.console-close{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:36px;height:18px;border-radius:0 0 8px 8px;background:rgba(95,214,240,.1);border:1px solid rgba(95,214,240,.2);border-top:none;color:#5a7a94;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.console-toggle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4px + env(safe-area-inset-bottom));z-index:19;width:40px;height:22px;border-radius:11px 11px 0 0;background:rgba(8,20,36,.8);border:1px solid rgba(95,214,240,.3);border-bottom:none;color:#5a7a94;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dt{text-align:center;font-size:14px;font-weight:700;color:#eaf6ff;text-shadow:0 0 10px rgba(95,214,240,.4)}
.dtsub{text-align:center;font-size:11px;color:#9fc6dd;margin-top:2px}
.toolrow{display:flex;justify-content:center;gap:6px;margin-top:4px}
.tool{flex:1;max-width:160px;border:1px solid rgba(95,214,240,.3);background:rgba(10,24,42,.55);border-radius:14px;padding:4px 0;cursor:pointer;text-align:center;font-size:11px;color:#bfe4f5;font-weight:600}
.tlrow{display:flex;align-items:center;margin:4px auto;max-width:260px}
.tlrow input[type=range]{flex:1;margin:0 4px;accent-color:#5fd6f0}
.spanbtn{width:30px;height:26px;border-radius:4px;border:1px solid rgba(95,214,240,.3);color:#5fd6f0;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(10,24,42,.55);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:#7fa8c4;padding:0 36px}
.transport{display:flex;justify-content:center;margin-top:6px;gap:4px}
.tb{min-width:40px;height:30px;border-radius:4px;border:1px solid rgba(95,214,240,.3);background:rgba(10,24,42,.55);color:#5fd6f0;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.tb.main{background:linear-gradient(90deg,#2aa9c8,#1c7fa0);color:#04121c;font-weight:800;min-width:50px}
.tb.now{color:#f5c451;border-color:rgba(245,196,81,.4)}
.quickrow{display:flex;justify-content:center;gap:6px;margin-top:6px}
.qbtn{min-width:30px;height:26px;padding:0 6px;border-radius:6px;border:1px solid rgba(95,214,240,.2);background:rgba(10,24,42,.45);color:#7fa8c4;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qbtn.on{color:#5fd6f0;border-color:rgba(95,214,240,.5)}
.spds{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.spd-picker{padding:5px 14px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid rgba(95,214,240,.3);background:rgba(10,24,42,.55);color:#dff0fb;cursor:pointer}
.spd-chip{min-width:32px;height:28px;padding:0 8px;border-radius:14px;border:1px solid rgba(95,214,240,.3);background:rgba(10,24,42,.55);color:#7fa8c4;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.spd-chip.on{color:#5fd6f0;border-color:rgba(95,214,240,.6);box-shadow:inset 0 0 8px rgba(95,214,240,.15)}
.spd-chip.wide{padding:0 10px;font-size:12px;white-space:nowrap}
.spd-opt{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid rgba(95,214,240,.3);background:rgba(10,24,42,.55);color:#dff0fb;cursor:pointer}
.spd-opt.on{background:linear-gradient(90deg,#5fd6f0,#2aa9c8);color:#04121c;border-color:transparent}
.tz-opt{padding:8px 12px;border-radius:6px;font-size:13px;color:#bfe4f5;cursor:pointer;margin-bottom:4px}
.tz-opt:active{background:rgba(95,214,240,.15)}
.tz-opt.on{color:#5fd6f0;font-weight:700}

/* ===== 节气标签 ===== */
.slab{position:absolute;transform:translate(-50%,-50%);font-size:9px;color:rgba(255,210,74,.6);opacity:.7;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.9);letter-spacing:1px;white-space:nowrap;z-index:5}
.slab-m{font-size:11px;color:#ffd24a;opacity:.9;font-weight:700}
.slab-c{font-size:12px;color:#5fd6f0;opacity:1;font-weight:800;text-shadow:0 0 10px rgba(95,214,240,.7)}
.slab-d{width:4px;height:4px;border-radius:50%;background:rgba(255,210,74,.45);font-size:0}

/* ===== 行星标签 ===== */
.plab{position:absolute;transform:translate(-50%,-100%);z-index:5;background:rgba(7,18,34,.78);border:1px solid rgba(95,214,240,.3);border-radius:3px;padding:3px 7px;font-size:11px;color:#eaf6ff;white-space:nowrap;pointer-events:none}
.plab .nm{font-weight:700}.plab .au{color:#5fd6f0;margin-left:5px;font-size:10px}
.plab::before{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:rgba(95,214,240,.3)}

/* ===== 信息卡弹窗 ===== */
.card-mask{position:fixed;inset:0;z-index:50;background:rgba(2,5,12,.5);display:flex;align-items:center;justify-content:center}
.card{width:78vw;max-width:320px;border-radius:8px;padding:14px 16px;background:rgba(8,20,36,.95);border:1px solid rgba(95,214,240,.7);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card .hdr{display:flex;align-items:center;margin-bottom:8px}
.card .hdr .bar{width:3px;height:16px;background:#5fd6f0;box-shadow:0 0 8px #5fd6f0;border-radius:2px;margin-right:8px}
.card .hdr .bar.gold{background:#f5c451;box-shadow:0 0 8px #f5c451}
.card .hdr .title{font-size:17px;font-weight:800;color:#fff;flex:1}
.card .hdr .close{color:#7fa8c4;font-size:20px;cursor:pointer;padding:0 4px}
.card .row{display:flex;justify-content:space-between;font-size:12.5px;color:#7fa8c4;padding:4px 0;border-bottom:1px solid rgba(95,214,240,.08)}
.card .row .val{color:#dff0fb}
.card .note{margin-top:8px;font-size:12px;color:#cfe4f2;line-height:1.6;background:rgba(95,214,240,.06);border:1px solid rgba(95,214,240,.18);border-radius:4px;padding:8px}

/* ===== 菜单底部面板 ===== */
.menu-mask{position:fixed;inset:0;z-index:40;background:rgba(2,5,12,.5)}
.menu-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:rgba(10,20,38,.97);border:1px solid rgba(95,214,240,.35);border-radius:14px 14px 0 0;padding:10px 0 calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.menu-sheet.open{transform:translateY(0)}
.menu-section{padding:6px 16px 2px}
.menu-section+.menu-section{border-top:1px solid rgba(95,214,240,.1);margin-top:4px;padding-top:8px}
.menu-title{font-size:11px;color:#5a7a94;letter-spacing:2px;margin-bottom:6px;font-weight:600}
.menu-item{display:flex;align-items:center;padding:11px 4px;border-radius:8px;cursor:pointer}
.menu-item:active{background:rgba(95,214,240,.08)}
.mi-icon{width:32px;font-size:18px;text-align:center;flex-shrink:0}
.mi-label{flex:1;font-size:14px;color:#d8e8f6;font-weight:600}
.mi-state{font-size:12px;color:#5a7a94;font-weight:600;min-width:36px;text-align:right}
.mi-state.on{color:#5fd6f0}

/* ===== 操作引导 ===== */
.guide-overlay{position:fixed;inset:0;z-index:60;background:rgba(2,6,16,.72)}
.guide-hl{position:fixed;z-index:61;border:2px solid rgba(95,214,240,.85);border-radius:12px;box-shadow:0 0 24px rgba(95,214,240,.45);pointer-events:none;animation:gpulse 2s ease-in-out infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 24px rgba(95,214,240,.45)}50%{box-shadow:0 0 32px rgba(95,214,240,.65)}}
.guide-hl-dial{left:50%;top:36%;width:56vw;height:56vw;max-width:280px;max-height:280px;transform:translate(-50%,-50%);border-radius:50%}
.guide-card{position:fixed;left:50%;transform:translateX(-50%);z-index:62;width:280px;background:rgba(8,20,36,.96);border:1px solid rgba(95,214,240,.65);border-radius:10px;padding:16px 18px 12px}
.guide-card .title{font-size:17px;font-weight:800;color:#eaf6ff;margin-bottom:8px}
.guide-card .desc{font-size:13px;line-height:1.75;color:#bfe4f5;white-space:pre-line}
.guide-card .row{display:flex;align-items:center;margin-top:14px}
.guide-card .skip{font-size:12px;color:#6a8ea8;cursor:pointer}
.guide-card .dots{flex:1;display:flex;justify-content:center;gap:6px}
.guide-card .dot{width:6px;height:6px;border-radius:50%;background:rgba(95,214,240,.25)}
.guide-card .dot.on{background:#5fd6f0;box-shadow:0 0 6px rgba(95,214,240,.7)}
.guide-card .nav{display:flex;align-items:center;gap:8px}
.guide-card .prev{font-size:12px;color:#7fa8c4;cursor:pointer}
.guide-card .next{font-size:13px;font-weight:700;color:#04121c;background:linear-gradient(90deg,#5fd6f0,#2aa9c8);padding:6px 14px;border-radius:14px;cursor:pointer}

/* ===== 命理/历法报告 ===== */
.fort-mask{position:fixed;inset:0;z-index:50;background:rgba(2,5,12,.5);display:flex;align-items:center;justify-content:center}
.fort-card{width:85vw;max-width:400px;max-height:78vh;border-radius:10px;padding:14px 16px;background:rgba(8,20,36,.95);border:1px solid rgba(180,140,230,.6);display:flex;flex-direction:column}
.fort-card .hdr{display:flex;align-items:center;margin-bottom:8px}
.fort-card .hdr .bar{width:3px;height:16px;background:#f5c451;border-radius:2px;margin-right:8px}
.fort-card .hdr .title{font-size:17px;font-weight:800;color:#fff;flex:1}
.fort-card .hdr .close{color:#7fa8c4;font-size:20px;cursor:pointer}
.fort-body{flex:1;overflow-y:auto;margin-top:6px}
.fort-text{font-size:13px;line-height:1.85;color:#d8e8f6;white-space:pre-wrap;word-break:break-word}
.fort-loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:55;display:flex;flex-direction:column;align-items:center;gap:14px}
.fort-spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(180,140,230,.2);border-top-color:#b48ce6;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fort-ltxt{font-size:14px;color:#d4a0ff;letter-spacing:3px}

/* ===== 星空旅行 HUD ===== */
.voy-hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.voy-hud>*{pointer-events:auto}
.voy-top{position:absolute;top:env(safe-area-inset-top);left:14px;display:flex;align-items:center;gap:9px}
.voy-ava{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(120,230,255,.7);background:rgba(8,24,44,.6);display:flex;align-items:center;justify-content:center;font-size:20px}
.voy-meta .nick{font-size:14px;font-weight:800;color:#eaf9ff;text-shadow:0 0 10px rgba(95,214,240,.6);letter-spacing:1px}
.voy-meta .mis{font-size:11px;color:#7fe6ff;letter-spacing:1px}
.voy-dest{position:absolute;top:calc(env(safe-area-inset-top) + 44px);left:14px;padding:5px 12px;border-radius:16px;font-size:12px;color:#bfeeff;border:1px solid rgba(120,230,255,.45);background:rgba(8,22,40,.55);cursor:pointer}
.voy-pass{position:absolute;top:calc(env(safe-area-inset-top) + 80px);left:0;right:0;text-align:center}
.voy-pass .lab{font-size:10px;color:#6fd0ee;letter-spacing:3px}
.voy-pass .txt{font-size:13px;font-weight:700;color:#d8f6ff;text-shadow:0 0 10px rgba(95,214,240,.6);margin-top:2px}
.voy-stat{position:absolute;bottom:calc(90px + env(safe-area-inset-bottom));pointer-events:none}
.voy-stat .lab{font-size:10px;color:#6fd0ee;letter-spacing:2px}
.voy-stat .val{font-size:18px;font-weight:800;color:#d8f6ff;text-shadow:0 0 12px rgba(95,214,240,.7)}
.voy-stat.sl{left:16px;text-align:left}
.voy-stat.sr{right:16px;text-align:right}
.voy-stat.sc{left:0;right:0;text-align:center}
.voy-ctrl{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:14px}
.voy-btn{min-width:76px;text-align:center;padding:11px 0;border-radius:26px;color:#bfeeff;font-size:14px;font-weight:700;letter-spacing:3px;border:1px solid rgba(120,230,255,.5);background:rgba(8,24,46,.5);cursor:pointer}
.voy-btn.cr{min-width:92px;background:linear-gradient(180deg,#aef0ff,#4fc8ee);color:#051322;border-color:#aef0ff}
.voy-exit{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:14px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(120,230,255,.45);background:rgba(8,22,40,.5);color:#bfecff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.voy-destpicker{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:14px;padding:5px 12px;border-radius:16px;font-size:12px;color:#bfeeff;border:1px solid rgba(120,230,255,.45);background:rgba(8,22,40,.55);cursor:pointer}
.voy-labels{position:absolute;inset:0;pointer-events:none}
.voy-label{position:absolute;transform:translate(-50%,-150%);font-size:11px;color:#cdeeff;white-space:nowrap;padding:1px 6px;border-radius:8px;background:rgba(6,16,32,.5);border:1px solid rgba(120,230,255,.28)}
</style>
</head>
<body>

<!-- 速度选择弹窗 -->
<div id="spdPopup" style="display:none;position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:25;background:rgba(10,20,38,.96);border:1px solid rgba(95,214,240,.5);border-radius:12px;padding:8px 10px">
  <div style="display:flex;gap:6px">
    <div class="spd-opt" data-u="sec">秒/秒</div><div class="spd-opt" data-u="hour">时/秒</div>
    <div class="spd-opt" data-u="day">日/秒</div><div class="spd-opt" data-u="month">月/秒</div><div class="spd-opt" data-u="year">年/秒</div>
  </div>
</div>
<!-- 时区选择弹窗 -->
<div id="tzPopup" style="display:none;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5);align-items:center;justify-content:center">
  <div style="background:rgba(10,20,38,.97);border:1px solid rgba(95,214,240,.5);border-radius:12px;padding:16px;max-width:280px;width:80vw">
    <div style="font-size:15px;font-weight:700;color:#eaf6ff;margin-bottom:12px;text-align:center">选择时区</div>
    <div id="tzOptions"></div>
    <div style="text-align:center;margin-top:12px"><span onclick="document.getElementById('tzPopup').style.display='none'" style="color:#6a8ea8;font-size:13px;cursor:pointer">取消</span></div>
  </div>
</div>
<!-- 事件捕获层（在canvas之上、UI之下，转发触摸/鼠标给canvas处理器） -->
<div id="touchLayer" style="position:fixed;inset:0;z-index:5;pointer-events:auto"></div>
<!-- 3D 画布（太阳系+星空旅行） -->
<canvas id="gl"></canvas>
<!-- 2D 画布（地球表盘） -->
<canvas id="cv"></canvas>

<!-- 顶部栏 -->
<div class="topbar" id="topbar">
  <span class="brand">时间景观</span>
  <div class="view-seg" id="viewSeg">
    <button data-v="solar">太阳系</button>
    <button data-v="earth" class="on">地球</button>
  </div>
  <div class="menu-btn" id="menuBtn">☰</div>
</div>

<!-- 地球信息条 -->
<div class="einfo" id="einfo">
  <span class="ei1" id="eiMoon"></span>
  <span class="ei2" id="eiTerm"></span>
  <span class="ei3" id="eiZodiac"></span>
</div>

<!-- 右侧栏（已精简，功能都在菜单面板中） -->

<!-- 底部控制台 -->
<div class="console-toggle" id="consoleToggle" style="display:none">▲</div>
<div class="console" id="console">
  <div class="console-close" id="consoleClose">▼</div>
  <div id="consoleBody">
    <div class="dt" id="dateText"></div>
    <div class="dtsub" id="dateSub"></div>
    <div class="toolrow">
      <div class="tool" id="tzBtn">🕓 UTC+8 北京</div>
      <input type="date" class="tool" id="jumpDate" style="padding:4px">
      <input type="time" class="tool" id="jumpTime" value="12:00" step="1" style="padding:4px">
    </div>
    <div class="tlrow">
      <div class="spanbtn" id="spanIn">−</div>
      <input type="range" id="timeline" min="-100" max="100" value="0" step="0.05">
      <div class="spanbtn" id="spanOut">＋</div>
    </div>
    <div class="ticks"><span id="spanL">−100年</span><span>现在</span><span id="spanR">+100年</span></div>
    <div class="transport">
      <div class="tb" id="pPrev">‹‹</div>
      <div class="tb" id="pSlow">◀◀</div>
      <div class="tb main" id="pPlay">❚❚</div>
      <div class="tb" id="pFast">▶▶</div>
      <div class="tb" id="pNext">››</div>
      <div class="tb now" id="pNow">现在</div>
    </div>
    <div class="quickrow">
      <div class="qbtn" id="qLabels">🏷</div>
      <div class="qbtn" id="qOrbit">◷</div>
      <div class="qbtn" id="qReset">⌖</div>
      <div class="qbtn" id="qTop">⊕</div>

<script>

// ========== 天文算法（移植自 shared/core/astro.js） ==========
const RAD = Math.PI / 180;

const SYN = 29.530588853;
const dnum = ms => (ms - J2000) / 86400e3;
const rev = x => { x %= 360; return x < 0 ? x + 360 : x; };

function sunLon(d) {
  d += 1.5;
  const w = 282.9404 + 4.70935e-5 * d, e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.0470 + 0.9856002585 * d), Mr = M * RAD;
  const E = M + (e / RAD) * Math.sin(Mr) * (1 + e * Math.cos(Mr));
  const Er = E * RAD;
  return rev(Math.atan2(Math.sqrt(1 - e * e) * Math.sin(Er), Math.cos(Er) - e) / RAD + w);
}
function moonLon(d) {
  d += 1.5;
  const N = rev(125.1228 - 0.0529538083 * d), e = 0.0549;
  const M = rev(115.3654 + 13.0649929509 * d), Mr = M * RAD;
  let E = M + (e / RAD) * Math.sin(Mr);
  for (let k = 0; k < 4; k++) { const Er = E * RAD; E = E - (E - (e / RAD) * Math.sin(Er) - M) / (1 - e * Math.cos(Er)); }
  const Er = E * RAD, xv = Math.cos(Er) - e, yv = Math.sqrt(1 - e * e) * Math.sin(Er);
  const v = Math.atan2(yv, xv) / RAD, w = rev(318.0634 + 0.1643573223 * d);
  return rev(v + w);
}
function moonPhase(d) {
  const el = rev(moonLon(d) - sunLon(d)), illum = (1 - Math.cos(el * RAD)) / 2, age = SYN * el / 360;
  const name = el < 22.5 || el >= 337.5 ? '新月' : el < 67.5 ? '峨眉月' : el < 112.5 ? '上弦月' : el < 157.5 ? '盈凸月' : el < 202.5 ? '满月' : el < 247.5 ? '亏凸月' : el < 292.5 ? '下弦月' : '残月';
  return { el, illum, age, name };
}
function moonDistKm(d) {
  d += 1.5; const M = rev(115.3654 + 13.0649929509 * d), Mr = M * RAD;
  let E = M + (0.0549 / RAD) * Math.sin(Mr);
  for (let k = 0; k < 3; k++) { const Er = E * RAD; E = E - (E - (0.0549 / RAD) * Math.sin(Er) - M) / (1 - 0.0549 * Math.cos(Er)); }
  const Er = E * RAD, xv = Math.cos(Er) - 0.0549, yv = Math.sqrt(1 - 0.0549 * 0.0549) * Math.sin(Er);

const TERMS = ['春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒','立春','雨水','惊蛰'];
function solarTerm(d) {
  const SL = rev(sunLon(d)), i = Math.floor(SL / 15) % 24, within = SL - i * 15, perDay = 360 / 365.2422;
  return { name: TERMS[i], toNext: Math.max(1, Math.round((15 - within) / perDay)), next: TERMS[(i + 1) % 24], idx: i };
}
const GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
function gzYear(y) { return GAN[(y - 4) % 10] + ZHI[(y - 4) % 12]; }
const PLANET_EN = {'水星':'Mercury','金星':'Venus','地球':'Earth','火星':'Mars','木星':'Jupiter','土星':'Saturn','天王星':'Uranus','海王星':'Neptune'};

// ========== 行星数据 ==========
const PLANETS = [
  { n:'水星', a:0.387, sz:1.8, dia:'4,879 km', temp:'−173~427°C', type:'类地行星', moons:'0', P:0.241, rot:58.6, tex:'mercury' },
  { n:'金星', a:0.723, sz:2.4, dia:'12,104 km', temp:'462°C', type:'类地行星', moons:'0', P:0.615, rot:-243, tex:'venus' },
  { n:'地球', a:1.000, sz:2.6, dia:'12,742 km', temp:'15°C', type:'类地行星', moons:'1', P:1.000, rot:1.0, tex:'earth' },
  { n:'火星', a:1.524, sz:2.0, dia:'6,779 km', temp:'−63°C', type:'类地行星', moons:'2', P:1.881, rot:1.03, tex:'mars' },
  { n:'木星', a:5.203, sz:6.0, dia:'139,820 km', temp:'−108°C', type:'气态巨行星', moons:'95', P:11.86, rot:0.41, tex:'jupiter' },
  { n:'土星', a:9.537, sz:5.2, dia:'116,460 km', temp:'−139°C', type:'气态巨行星', moons:'146', P:29.46, rot:0.44, tex:'saturn' },
  { n:'天王星', a:19.19, sz:3.8, dia:'50,724 km', temp:'−197°C', type:'冰巨星', moons:'28', P:84.01, rot:-0.72, tex:'uranus' },
  { n:'海王星', a:30.07, sz:3.6, dia:'49,244 km', temp:'−201°C', type:'冰巨星', moons:'16', P:164.8, rot:0.67, tex:'neptune' }

// ========== 状态 ==========
const state = { t: Date.now(), playing: true, spd: 1000, view: 'earth', hemi: 1 };
const layers = { orbit: true, names: true, const: true };
let dispT = Date.now(), anchorT = Date.now();
let tlSpan = 100, tlDrag = false, inertia = 0, scrubVel = 0;
const SPD = { sec: 1000, hour: 3600e3, day: 86400e3, month: 86400e3 * 30, year: 86400e3 * 365.25 };
let curUnit = 'day';
const TIMEZONES = [
  { label: 'UTC+8 北京', min: 480 }, { label: 'UTC+0 伦敦', min: 0 }, { label: 'UTC+9 东京', min: 540 },
  { label: 'UTC+5:30 印度', min: 330 }, { label: 'UTC+1 中欧', min: 60 }, { label: 'UTC-5 纽约', min: -300 },
  { label: 'UTC-8 洛杉矶', min: -480 }

let tzIdx = 0, tz = TIMEZONES[0];

// ========== 图片加载（浏览器自动缓存，无需 Cache API）==========
function loadImage(img, url) {
  img.src = url;
}

// ========== Canvas 2D（地球表盘） ==========
var renderer = null, scene = null, cam = null;  // 提前声明避免暂时性死区
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, stars2d = [], earthZoom = 1;

  stars2d = [];
  for (let i = 0; i < Math.round(W * H / 4500); i++) stars2d.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.2, a: 0.2 + Math.random() * 0.6 });

}

resize();

// ========== Three.js 3D ==========
let raycaster, sunMesh, sunGlow, fillLight;
let planetMeshes = [], planetGroups = [], gConst;
let camS = { r: 175, th: 0, ph: 0.01, tr: 175, tth: 0, tph: 0.01 };

// ========== 行星贴图加载 ==========
function loadPlanetTex(mat, filename) {
  const url = TEXBASE + filename;
  // fetch 下载为 blob → data URL，绕过 WebGL 跨域限制
  fetch(url).then(r => r.blob()).then(blob => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const tex = new THREE.Texture(img);
          tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
          tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
          tex.needsUpdate = true;
          mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true;
        } catch (e) {}
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(blob);
  }).catch(() => {});
}

function initThree() {
  const glCanvas = document.getElementById('gl');
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: false });
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03050c);
  cam = new THREE.PerspectiveCamera(H > W ? 62 : 50, W / H, 0.1, 5000);
  cam.up.set(1, 0, 0);
  cam.position.set(0, 175, 0.02);

  // 灯光
  scene.add(new THREE.AmbientLight(0x96a4c0, 0.75));
  fillLight = new THREE.PointLight(0xdfe9ff, 1.4, 0, 0.12);
  scene.add(fillLight);

  // 星空背景
  const starGeo = new THREE.BufferGeometry();
  const starPos = [], starCol = [];
  for (let i = 0; i < 3000; i++) {
    starPos.push((Math.random() - 0.5) * 4000, (Math.random() - 0.5) * 4000, (Math.random() - 0.5) * 4000);
    const b = 0.4 + Math.random() * 0.6;
    starCol.push(b, b, b);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starCol, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true, sizeAttenuation: false })));

  // 太阳（带贴图）
  const sunGeo = new THREE.SphereGeometry(5.5, 48, 48);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
  sunMesh = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sunMesh);
  loadPlanetTex(sunMat, 'sun.jpg');
  // 太阳光晕（用 THREE.DataTexture 生成径向渐变，避免 CanvasTexture 兼容问题）
  const glowSize = 128, glowData = new Uint8Array(glowSize * glowSize * 4);
  for (let y = 0; y < glowSize; y++) {
    for (let x = 0; x < glowSize; x++) {
      const dx = x - glowSize / 2, dy = y - glowSize / 2;
      const d = Math.sqrt(dx * dx + dy * dy) / (glowSize / 2);
      const alpha = d < 0.3 ? 1 : d < 0.7 ? 1 - (d - 0.3) / 0.4 : 0;
      const idx = (y * glowSize + x) * 4;
      glowData[idx] = 255; glowData[idx + 1] = 220; glowData[idx + 2] = 100; glowData[idx + 3] = Math.round(alpha * 255);
    }
  }
  const glowTex = new THREE.DataTexture(glowData, glowSize, glowSize, THREE.RGBAFormat);
  glowTex.needsUpdate = true;
  const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  sunGlow = new THREE.Sprite(glowMat); sunGlow.scale.set(36, 36, 1);
  scene.add(sunGlow);

  // 行星（带贴图）
  PLANETS.forEach((p, i) => {
    const geo = new THREE.SphereGeometry(p.sz, 36, 36);
    const mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8, metalness: 0.1 });
    loadPlanetTex(mat, p.tex + '.jpg');
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = p;
    const grp = new THREE.Group(); grp.add(mesh); scene.add(grp);

    const orbR = SCALE(p.a);

      Array.from({ length: 129 }, (_, k) => { const a = k / 128 * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * orbR, 0, -Math.sin(a) * orbR); })

}

// ========== 渲染主循环 ==========
let lastT = 0;
const _v = new THREE.Vector3();
function project(v3) {
  _v.copy(v3).project(cam);
  return { x: (_v.x * 0.5 + 0.5) * W, y: (-_v.y * 0.5 + 0.5) * H, vis: _v.z < 1 };
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  // 时间推进
  if (!tlDrag) {
    if (state.playing) state.t += state.spd * dt;
    if (inertia) { state.t += inertia * dt; inertia *= Math.exp(-1.4 * dt); if (Math.abs(inertia) < 1000) inertia = 0; }
  }
  dispT += (state.t - dispT) * (1 - Math.exp(-8 * dt));
  const d = dnum(dispT), date = new Date(dispT + tz.min * 60000);

  // ===== 星空旅行模式 =====
  if (state.view === 'voyage') {
    updateVoyage(dt, now);
    return;
  }

  // ===== 地球 2D =====
  if (state.view === 'earth') {
    drawEarth(d, date);
    document.getElementById('einfo').style.display = '';
    document.getElementById('voyHud').style.display = 'none';
  }

  // ===== 太阳系 3D =====
  if (state.view === 'solar') {
    updateSolar(d, dt);
    document.getElementById('einfo').style.display = 'none';
    document.getElementById('voyHud').style.display = 'none';
  }

  // 日期读数
  if (now - (frame._hudT || 0) > 200) {
    frame._hudT = now;
    updateHUD(d, date);
  }
}

// ========== 太阳系 3D 更新 ==========
function updateSolar(d, dt) {
  for (let i = 0; i < PLANETS.length; i++) {
    const p = PLANETS[i], R = SCALE(p.a), a = planetLon(p, d) * RAD;
    planetGroups[i].position.set(Math.cos(a) * R, 0, -Math.sin(a) * R);
    planetMeshes[i].rotation.y = ((d / p.rot) % 1) * 2 * Math.PI;
  }
  sunMesh.rotation.y += 0.15 * dt;
  sunGlow.scale.set(22 * (1 + Math.sin(Date.now() / 600) * 0.04), 22 * (1 + Math.sin(Date.now() / 600) * 0.04), 1);

  // 相机（up=(1,0,0) 让夏至(+X)始终朝屏幕上方12点钟）
  camS.r += (camS.tr - camS.r) * 0.12;
  camS.th += (camS.tth - camS.th) * 0.12;
  camS.ph += (camS.tph - camS.ph) * 0.12;
  cam.up.set(1, 0, 0);
  const sp = Math.sin(camS.ph);
  cam.position.set(camS.r * sp * Math.sin(camS.th), camS.r * Math.cos(camS.ph), camS.r * sp * Math.cos(camS.th));
  cam.lookAt(0, 0, 0);
  cam.lookAt(0, 0, 0);
  fillLight.position.copy(cam.position);

  renderer.render(scene, cam);

  // 行星标签
  if (layers.names) {
    PLANETS.forEach((p, i) => {
      const s = project(planetGroups[i].position);
      let el = document.getElementById('plab' + i);
      if (!el) { el = document.createElement('div'); el.className = 'plab'; el.id = 'plab' + i; document.body.appendChild(el); }
      if (s.vis && s.x > 0 && s.x < W) { el.style.display = ''; el.style.left = s.x + 'px'; el.style.top = (s.y - 20) + 'px'; el.innerHTML = '<span class="nm">' + p.n + '</span><span class="au">' + p.a.toFixed(2) + ' AU</span>'; }
      else el.style.display = 'none';
    });
  } else {
    PLANETS.forEach((_, i) => { const el = document.getElementById('plab' + i); if (el) el.style.display = 'none'; });
  }

  // 节气标签
  if (layers.orbit && window._seasonPts) {
    const curIdx = solarTerm(d).idx;
    window._seasonPts.forEach((sp, i) => {
      const s = project(sp);
      let el = document.getElementById('slab' + i);
      if (!el) { el = document.createElement('div'); el.id = 'slab' + i; document.body.appendChild(el); }
      if (!s.vis || s.x < 10 || s.x > W - 10) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
      const major = [0, 6, 12, 18].includes(sp.idx);
      const isCur = sp.idx === curIdx;
      el.className = isCur ? 'slab slab-c' : major ? 'slab slab-m' : 'slab slab-d';
      el.textContent = isCur || major ? sp.name : '';
    });
  }
}

function makeEarthTex() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  let g = x.createRadialGradient(s * 0.38, s * 0.34, s * 0.05, s * 0.5, s * 0.5, s * 0.6);
  g.addColorStop(0, '#2a78c0'); g.addColorStop(1, '#0c2f57');
  x.fillStyle = g; x.beginPath(); x.arc(s / 2, s / 2, s / 2, 0, 7); x.fill();
  x.fillStyle = 'rgba(54,148,92,.92)';
  [[90, 70, 46, 30], [150, 150, 52, 40], [60, 170, 30, 26], [185, 95, 30, 24], [120, 200, 40, 20]].forEach(([bx, by, rw, rh]) => { x.beginPath(); x.ellipse(bx, by, rw, rh, 0, 0, 7); x.fill(); });
  x.fillStyle = 'rgba(235,245,255,.85)';
  x.beginPath(); x.arc(s / 2, 28, 40, 0, 7); x.fill();
  x.beginPath(); x.arc(s / 2, s - 26, 46, 0, 7); x.fill();
  return c;
}
let earthTex = null;

function drawMoonLit(mx, my, r, illum, rot) {
  const tex = moonReady ? moonImg : null;
  ctx.save(); ctx.translate(mx, my);
  ctx.beginPath(); ctx.arc(0, 0, r + 1, 0, 7); ctx.fillStyle = '#0a0e18'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
  if (tex) {
    ctx.drawImage(tex, -r, -r, 2 * r, 2 * r);
  } else {
    const g = ctx.createRadialGradient(-r * 0.15, -r * 0.1, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#cdd2dc'); g.addColorStop(0.5, '#b0b6c2'); g.addColorStop(0.85, '#8a90a0'); g.addColorStop(1, '#626878');
    ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    ctx.globalAlpha = 0.28;
    [[0.1, -0.05, 0.22], [-0.15, 0.1, 0.18], [0.18, 0.2, 0.15], [-0.05, -0.2, 0.2]].forEach(m => {
      const mg = ctx.createRadialGradient(m[0] * r, m[1] * r, 0, m[0] * r, m[1] * r, m[2] * r);
      mg.addColorStop(0, '#5a6070'); mg.addColorStop(1, 'rgba(90,96,112,0)');
      ctx.fillStyle = mg; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    });
    ctx.globalAlpha = 1;
  }
  ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i <= 30; i++) { const v = -1 + 2 * i / 30, sq = Math.sqrt(Math.max(0, 1 - v * v)), x = -r * sq, y = v * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  for (let i = 30; i >= 0; i--) { const v = -1 + 2 * i / 30, sq = Math.sqrt(Math.max(0, 1 - v * v)); ctx.lineTo((1 - 2 * illum) * r * sq, v * r); }
  ctx.closePath(); ctx.fillStyle = '#0a0e18'; ctx.fill();
  ctx.restore();
}

function drawEarth(d, date) {
  const cx = W / 2, cy = H * 0.55, R = Math.min(W, H) * 0.30 * earthZoom;
  const utcDate = new Date(dispT);  // 不加时区偏移，纯 UTC
  const utch = utcDate.getUTCHours() + utcDate.getUTCMinutes() / 60;
  const merid = (90 - utch * 15) * RAD;
  const ph = moonPhase(d);
  if (!earthTex) earthTex = makeEarthTex();

  // 背景
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
  g.addColorStop(0, '#0c1a38'); g.addColorStop(0.6, '#081024'); g.addColorStop(1, '#050a18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars2d) { ctx.globalAlpha = s.a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;

  // 太阳
  const sx = cx, sy = cy - R * 1.9;
  g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 0.42);
  g.addColorStop(0, 'rgba(255,246,220,.95)'); g.addColorStop(0.4, 'rgba(248,200,110,.4)'); g.addColorStop(1, 'rgba(245,170,70,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R * 0.42, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx, sy, 9, 0, 7); ctx.fill();

  // 清除阴影状态
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // 地球
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip(); ctx.translate(cx, cy);
  const south = state.hemi < 0;
  const eimg = south ? (earthImgS.complete && earthImgS.naturalWidth ? earthImgS : earthImg) : earthImg;
  ctx.rotate(south ? merid + 150 * RAD : merid);
  const RR = R * 1.08;
  if (earthReady) { ctx.drawImage(eimg, -RR, -RR, 2 * RR, 2 * RR); }
  else { ctx.drawImage(earthTex, -RR, -RR, 2 * RR, 2 * RR); }
  ctx.rotate(south ? -merid - 150 * RAD : -merid); ctx.restore();

  // 地球边框
  ctx.strokeStyle = 'rgba(95,214,240,.3)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, 7); ctx.stroke();

  // 时间刻度环（和小程序完全一致：0点正下方，逆时针 1-6-12-18-23）
  ctx.save(); ctx.translate(cx, cy); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let h = 0; h < 24; h++) {
    const a = -((h - 12) / 24) * 2 * Math.PI, nx = Math.sin(a), ny = -Math.cos(a);
    // 刻度线（短，贴近地球边框）
    const maj = h % 6 === 0;
    ctx.strokeStyle = maj ? 'rgba(95,214,240,.5)' : 'rgba(95,214,240,.25)'; ctx.lineWidth = maj ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(nx * R * 1.07, ny * R * 1.07); ctx.lineTo(nx * R * 1.12, ny * R * 1.12); ctx.stroke();
    // 小圆点
    ctx.fillStyle = 'rgba(150,200,230,.72)'; ctx.beginPath(); ctx.arc(nx * R * 1.14, ny * R * 1.14, 1.4, 0, 7); ctx.fill();
    // 双数=数字（不旋转，水平），单数=竖线（旋转朝向圆心）
    if (h % 2 === 0) {
      ctx.fillStyle = 'rgba(165,212,238,.92)'; ctx.font = '10px sans-serif';
      ctx.fillText(String(h).padStart(2, '0'), nx * R * 1.24, ny * R * 1.24);
    } else {
      ctx.save(); ctx.translate(nx * R * 1.24, ny * R * 1.24); ctx.rotate(a);
      ctx.fillStyle = 'rgba(135,185,214,.78)'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('|', 0, 0); ctx.restore();
    }
  }
  // 时区指针（和小程序一致）
  const ptr = (hh, col) => { const a = -((hh - 12) / 24) * 2 * Math.PI; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(Math.sin(a) * R * 1.08, -Math.cos(a) * R * 1.08); ctx.lineTo(Math.sin(a - 0.035) * R, -Math.cos(a - 0.035) * R); ctx.lineTo(Math.sin(a + 0.035) * R, -Math.cos(a + 0.035) * R); ctx.closePath(); ctx.fill(); };
  ptr(utch, '#5fd6f0'); ptr(utch + tz.min / 60, '#ffd24a');
  ctx.restore();

  // 城市标注
  const CITIES = [['北京',39.9,116.4],['东京',35.7,139.7],['温哥华',49.3,-123.1],['伦敦',51.5,0],['纽约',40.7,-74],['莫斯科',55.8,37.6]];
  CITIES.forEach(c => {
    const lat = c[1], lon = c[2];
    const rho = (90 - lat) / 90, dotR = Math.min(rho * R * 1.42, R * 0.9);
    const az = (90 - lon) * RAD + merid;
    const px = cx + Math.sin(az) * dotR, py = cy - Math.cos(az) * dotR;
    const night = py > cy;
    ctx.globalAlpha = night ? 0.6 : 1;
    ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(px, py, 3.6, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,74,.85)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(px, py, 7, 0, 7); ctx.stroke();
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
    const tw = ctx.measureText(c[0]).width;
    const lx = px + 10, ly = py - 8;
    ctx.fillStyle = 'rgba(6,14,30,.72)'; ctx.fillRect(lx - 4, ly, tw + 8, 17);
    ctx.fillStyle = '#fff7e0'; ctx.fillText(c[0], lx, ly + 9);
    ctx.globalAlpha = 1;
  });

  // 中央时钟表盘
  const rc = R * 0.18;
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, rc, 0, 7); ctx.fillStyle = 'rgba(247,250,255,.92)'; ctx.fill();
  ctx.strokeStyle = 'rgba(60,90,120,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * Math.PI; ctx.strokeStyle = 'rgba(40,60,90,.5)'; ctx.lineWidth = i % 3 === 0 ? 1.5 : 0.7; ctx.beginPath(); ctx.moveTo(Math.sin(a) * rc * 0.82, -Math.cos(a) * rc * 0.82); ctx.lineTo(Math.sin(a) * rc * 0.95, -Math.cos(a) * rc * 0.95); ctx.stroke(); }
  ctx.fillStyle = 'rgba(28,43,68,.9)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.max(7, Math.round(rc * 0.34)) + 'px sans-serif';
  ctx.fillText(p2(date.getUTCMonth() + 1) + '.' + p2(date.getUTCDate()), 0, rc * 0.45);
  const minu = date.getUTCMinutes() + date.getUTCSeconds() / 60;
  const sec = date.getUTCSeconds() + date.getUTCMilliseconds() / 1000;
  let a = minu / 60 * 2 * Math.PI; ctx.strokeStyle = '#1c2b44'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a) * rc * 0.6, -Math.cos(a) * rc * 0.6); ctx.stroke();
  a = sec / 60 * 2 * Math.PI; ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-Math.sin(a) * rc * 0.12, Math.cos(a) * rc * 0.12); ctx.lineTo(Math.sin(a) * rc * 0.78, -Math.cos(a) * rc * 0.78); ctx.stroke();
  ctx.fillStyle = '#1c2b44'; ctx.beginPath(); ctx.arc(0, 0, rc * 0.07, 0, 7); ctx.fill();
  ctx.restore();

  // 月球
  const Or = R * 1.15, ma = ph.el * RAD, mx = cx - Math.sin(ma) * Or, my = cy - Math.cos(ma) * Or, mr = 16;
  const cAng = Math.atan2(cy - my, cx - mx), sAng = Math.atan2(sy - my, sx - mx);
  const adist = (a, b) => { let dd = Math.abs((a - b) % (2 * Math.PI)); return dd > Math.PI ? 2 * Math.PI - dd : dd; };
  const t1 = cAng - Math.PI / 2, t2 = cAng + Math.PI / 2;
  const mrot = adist(t1, sAng) <= adist(t2, sAng) ? t1 : t2;
  drawMoonLit(mx, my, mr, ph.illum, mrot);
  window._moonXY = { x: mx, y: my, r: mr };
}

function initVoyageScene() {
  // 复用已有 renderer/scene/cam 但创建旅行专用场景
  voyage = { scene: new THREE.Scene(), cam: new THREE.PerspectiveCamera(70, W / H, 0.1, 9000), waypoints: [] };
  voyage.scene.background = new THREE.Color(0x03050c);
  voyage.scene.add(new THREE.AmbientLight(0x96a4c0, 0.75));
  const key = new THREE.PointLight(0xdfe9ff, 1.4, 0, 0.12); key.position.set(30, 20, 40); voyage.scene.add(key);
  // 星空
  const p = [], c = [];
  for (let i = 0; i < 2400; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * 6.283, s = Math.sqrt(1 - u * u), R = 3400;
    p.push(s * Math.cos(th) * R, u * R, s * Math.sin(th) * R);
    const t = Math.random(); const b = 0.45 + Math.random() * 0.55;
    c.push((t < 0.25 ? 0.72 : t > 0.85 ? 1 : 1) * b, (t < 0.25 ? 0.8 : t > 0.85 ? 0.84 : 1) * b, (t < 0.25 ? 1 : t > 0.85 ? 0.64 : 1) * b);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  voyage.scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending })));

}

  document.getElementById('voyEta').textContent = '—';
}

function updateVoyage(dt, now) {
  if (_voyState === 'run') {
    const target = WLV[_warpIdx] || 0;
    _speedC += (target - _speedC) * Math.min(1, dt * 1.1);
    const dMY = dt * 10 / 365.25;
    _missionY += dMY;
    _distLy += _speedC * dMY;
    if (_speedC > _maxC) _maxC = _speedC;
    if (_distLy >= _destDist) { _distLy = _destDist; _voyState = 'arrived'; }
  }
  // 渲染
  renderer.render(voyage.scene, voyage.cam);
  // HUD
  if (now - (updateVoyage._hudT || 0) > 300) {
    updateVoyage._hudT = now;
    document.getElementById('voySpeed').textContent = _speedC < 0.01 ? (_speedC * 299792).toFixed(0) + ' km/s' : _speedC.toFixed(2) + ' c';
    document.getElementById('voyDist').textContent = _distLy < 0.02 ? (_distLy / AU_LY).toFixed(2) + ' AU' : _distLy.toFixed(2) + ' ly';
    document.getElementById('voyEta').textContent = _voyState === 'arrived' ? '已抵达' : _speedC > 1e-9 ? fmtTime(_destDist - _distLy, _speedC) : '—';
    document.getElementById('voyPass').textContent = _voyState === 'arrived' ? '已抵达 ' + COS_DEST[_destIdx].name : '— 星际空间 —';
    document.getElementById('voyGo').textContent = _voyState === 'orbit' ? '出发' : _voyState === 'run' ? '暂停' : _voyState === 'pause' ? '继续' : '已抵达';
  }
}
function fmtTime(remLy, speedC) {
  const y = remLy / speedC;
  if (y < 1) return Math.round(y * 365) + ' 天';
  if (y < 100) return y.toFixed(1) + ' 年';
  return Math.round(y) + ' 年';
}

document.getElementById('voyGo').onclick = () => {
  if (_voyState === 'orbit') { _voyState = 'run'; _speedC = WLV[0]; }
  else if (_voyState === 'run') _voyState = 'pause';
  else if (_voyState === 'pause') _voyState = 'run';
};
document.getElementById('voySlow').onclick = () => { _warpIdx = Math.max(0, _warpIdx - 1); };
document.getElementById('voyFast').onclick = () => { _warpIdx = Math.min(WLV.length - 1, _warpIdx + 1); };
document.getElementById('voyExit').onclick = () => exitVoyage();

// ========== 触摸交互 ==========
let drag = null, pinch = null;
function onTouchStart(e) {
  e.preventDefault && e.preventDefault();
  if (e.touches.length >= 2) {
    const a = { x: e.touches[0].clientX, y: e.touches[0].clientY }, b = { x: e.touches[1].clientX, y: e.touches[1].clientY };
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: camS.tr, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    drag = null; return;
  }
  const t = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  drag = { x: t.x, y: t.y, moved: 0, pl: null, lastT: Date.now() };
  if (state.view === 'solar') {
    const idx = pickPlanet(t.x, t.y);
    if (idx >= 0) { drag.pl = idx; PLT.vibrate(); }
  }
}
function onTouchMove(e) {
  e.preventDefault && e.preventDefault();
  if (pinch && e.touches.length >= 2) {
    const a = { x: e.touches[0].clientX, y: e.touches[0].clientY }, b = { x: e.touches[1].clientX, y: e.touches[1].clientY };
    const dd = Math.hypot(a.x - b.x, a.y - b.y);
    if (dd > 0) camS.tr = Math.max(30, Math.min(340, pinch.r * pinch.d / dd));
    return;
  }
  if (!drag || !e.touches.length) return;
  const p = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  const dx = p.x - drag.x, dy = p.y - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));

  if (state.view === 'earth') { state.t -= dx * 1800000; drag.x = p.x; return; }
  if (drag.pl !== null && state.view === 'solar') {
    // 上帝之手：鼠标位置 → 轨道角度 → 时间
    const grp = planetGroups[drag.pl];
    const plScreen = project(grp.position);
    // 鼠标当前位置相对行星的角度
    const currAngle = Math.atan2(p.x - W / 2, -(p.y - H / 2));
    // 行星当前屏幕位置相对屏幕中心的角度
    const prevAngle = Math.atan2(plScreen.x - W / 2, -(plScreen.y - H / 2));
    let dA = prevAngle - currAngle;  // 取反：鼠标往右拉→行星往左追
    while (dA > Math.PI) dA -= 2 * Math.PI;
    while (dA < -Math.PI) dA += 2 * Math.PI;
    const pl = PLANETS[drag.pl];
    const timeMs = dA * (pl.P * 365.25 / 360) * 86400e3;
    state.t += timeMs;
    const now = Date.now();
    scrubVel = timeMs / Math.max((now - drag.lastT) / 1000, 0.001);
    drag.lastT = now; drag.x = p.x; drag.y = p.y;
    return;
  }
  // 相机旋转
  camS.tth -= dx * 0.008;
  camS.tph = Math.max(0.18, Math.min(1.45, camS.tph - dy * 0.008));
  drag.x = p.x; drag.y = p.y;
}
function onTouchEnd(e) {
  if (pinch && (!e.touches || e.touches.length < 2)) pinch = null;
  if (drag) {
    if (drag.pl !== null && drag.moved < 8) showPlanetCard(drag.pl);
    else if (drag.pl !== null && drag.moved >= 8) { inertia = scrubVel - (state.playing ? state.spd : 0); }
    else if (drag.moved < 8 && state.view === 'solar') {
      // 点击空白 → 隐藏 HUD
    }
    if (drag.pl !== null) { const el = document.getElementById('plab' + drag.pl); /* reset scale */ }
  }
  drag = null; scrubVel = 0;
}

function pickPlanet(px, py) {
  let best = -1, bestD = 1e9;
  for (let i = 0; i < PLANETS.length; i++) {
    const s = project(planetGroups[i].position);
    if (!s.vis) continue;
    const dd = Math.hypot(s.x - px, s.y - py), tol = Math.max(30, PLANETS[i].sz * 14);
    if (dd < tol && dd < bestD) { bestD = dd; best = i; }
  }
  return best;
}

const touchLayer = document.getElementById('touchLayer');
// 鼠标事件适配器
function mouseToTouch(e) { return { clientX: e.clientX, clientY: e.clientY }; }
function onMouseDown(e) { onTouchStart({ touches: [mouseToTouch(e)] }); }
function onMouseMove(e) { if (drag) { onTouchMove({ touches: [mouseToTouch(e)] }); e.preventDefault(); } }
function onMouseUp(e) { onTouchEnd({ touches: [] }); }
function onWheel(e) {
  e.preventDefault();
  if (state.view === 'solar') {
    camS.tr = Math.max(30, Math.min(340, camS.tr * (e.deltaY > 0 ? 1.1 : 0.9)));
  } else if (state.view === 'earth') {
    earthZoom = Math.max(0.5, Math.min(4, earthZoom * (e.deltaY > 0 ? 0.92 : 1.08)));
  }
}
touchLayer.addEventListener('touchstart', onTouchStart, { passive: false });
touchLayer.addEventListener('touchmove', onTouchMove, { passive: false });
touchLayer.addEventListener('touchend', onTouchEnd, { passive: true });
touchLayer.addEventListener('mousedown', onMouseDown);
touchLayer.addEventListener('mousemove', onMouseMove);
touchLayer.addEventListener('mouseup', onMouseUp);
touchLayer.addEventListener('wheel', onWheel, { passive: false });

// ========== 命理/历法 ==========
const API_URL = location.origin + location.pathname.replace(/[^/]*$/, '') + 'api/fortune';
let _fortBuf = '', _fortFlushed = '', _fortTimer = null;

function flushFort(force) {
  if (_fortBuf === _fortFlushed && !force) return;
  _fortFlushed = _fortBuf;
  document.getElementById('fortText').textContent = _fortBuf;
  document.getElementById('fortLoading').style.display = 'none';
  document.getElementById('fortMask').style.display = 'flex';
}

function startFortune() {
  const d = dnum(dispT), date = new Date(dispT + tz.min * 60000);
  const ph = moonPhase(d), st = solarTerm(d);
  _fortBuf = ''; _fortFlushed = '';
  document.getElementById('fortText').textContent = '';
  document.getElementById('fortLoading').style.display = 'flex';
  document.getElementById('fortMask').style.display = 'none';
  if (_fortTimer) clearInterval(_fortTimer);
  _fortTimer = setInterval(() => flushFort(), 90);

  const data = {
    dateText: date.getUTCFullYear() + '-' + p2(date.getUTCMonth() + 1) + '-' + p2(date.getUTCDate()) + ' ' + p2(date.getUTCHours()) + ':' + p2(date.getUTCMinutes()),
    lunar: gzYear(date.getUTCFullYear()) + '年',
    shichen: '', yearGZ: gzYear(date.getUTCFullYear()),
    solarTerm: st.name, termToNext: st.toNext,
    moonPhase: ph.name, moonAge: ph.age.toFixed(1), moonIllum: Math.round(ph.illum * 100),
    zodiac: '', sunLon: sunLon(d).toFixed(1), mode: 'almanac'
  };

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data })
  }).then(async r => {
    if (!r.body || !r.body.getReader) { const t = await r.text(); _fortBuf = t; flushFort(true); return; }
    const reader = r.body.getReader(), decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const text = decoder.decode(value, { stream: true });
      text.split('\n').forEach(line => {
        if (!line.startsWith('data:')) return;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') return;
        try { const j = JSON.parse(payload); if (j.content) _fortBuf += j.content; } catch (e) {}
      });
    }
    flushFort(true);
    if (_fortTimer) { clearInterval(_fortTimer); _fortTimer = null; }
  }).catch(e => { _fortBuf = '⚠️ ' + e.message; flushFort(true); });
}
document.getElementById('fortClose').onclick = () => { document.getElementById('fortMask').style.display = 'none'; };

const guideSteps = [
  { title: '地球表盘', desc: '左右拖动地球可拨转时间\n双指捏合缩放\n点月球查看详情' },
  { title: '功能菜单', desc: '点 ☰ 打开功能菜单\n切换视图、设置、语言\n解读历法、操作引导' },
  { title: '时间控制台', desc: '底部面板控制时间快慢\n进度条精确定位\n📅 跳转日期' },
  { title: '太阳系视角', desc: '拖行星 = 上帝之手\n点行星看详情\n轨道线、行星标签可开关' },
  { title: '解读星空历法', desc: 'AI 实时解读天文历法\n月相 · 节气 · 行星 · 星空\n点击菜单中的 ✨ 即可' }
];
let guideStep = 0;
function showGuide(step) {
  guideStep = step;
  const s = guideSteps[step];
  document.getElementById('guideTitle').textContent = (step + 1) + '. ' + s.title;
  document.getElementById('guideDesc').textContent = s.desc;
  let dots = '';
  guideSteps.forEach((_, i) => { dots += '<span class="dot' + (i === step ? ' on' : '') + '"></span>'; });
  document.getElementById('guideDots').innerHTML = dots;
  document.getElementById('guidePrev').style.display = step > 0 ? '' : 'none';
  document.getElementById('guideNext').textContent = step >= guideSteps.length - 1 ? '开始体验' : '下一步 ›';
  document.getElementById('guideOverlay').style.display = 'block';
  document.getElementById('guideCard').style.display = 'block';
  if (step === 3) setView('solar');
  else if (step < 3) setView('earth');
}
function closeGuide() {
  document.getElementById('guideOverlay').style.display = 'none';
  document.getElementById('guideCard').style.display = 'none';
  localStorage.setItem('guideSeen', '1');
  if (state.view !== 'earth') setView('earth');
}
document.getElementById('guideNext').onclick = () => { guideStep >= guideSteps.length - 1 ? closeGuide() : showGuide(guideStep + 1); };
document.getElementById('guidePrev').onclick = () => { if (guideStep > 0) showGuide(guideStep - 1); };
document.getElementById('guideSkip').onclick = closeGuide;
document.getElementById('guideOverlay').onclick = closeGuide;
