<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>时间景观</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05080f;font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#c8daf0;-webkit-font-smoothing:antialiased}

/* ===== 底图 ===== */
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;pointer-events:none;transition:opacity .4s}
#gl.show{opacity:1;pointer-events:none}

/* ===== 顶部栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;height:44px;background:linear-gradient(180deg,rgba(5,8,15,.92),transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{font-size:16px;font-weight:800;color:#eaf6ff;text-shadow:0 0 12px rgba(95,214,240,.5)}
.brand sub{font-size:9px;color:#5fd6f0;margin-left:4px;letter-spacing:1px;vertical-align:baseline}
.view-seg{display:flex;margin-left:auto;gap:2px}
.view-seg button{background:rgba(95,214,240,.08);border:1px solid rgba(95,214,240,.25);color:#6a8ea8;font-size:11px;padding:3px 10px;border-radius:12px;cursor:pointer;font-weight:600}
.view-seg button.on{background:linear-gradient(135deg,#5fd6f0,#2aa9c8);color:#04121c;border-color:transparent}
.menu-btn{width:32px;height:32px;border:1px solid rgba(95,214,240,.3);border-radius:4px;background:rgba(8,20,36,.7);color:#5fd6f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:8px}

/* ===== 地球信息条 ===== */
.einfo{position:fixed;top:44px;left:12px;z-index:15;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.einfo .ei2{font-size:11px;color:#ffd24a;text-shadow:0 0 6px rgba(0,0,0,.8)}

/* ===== 底部浮动操作栏 ===== */
.bottombar{position:fixed;left:8px;right:8px;bottom:8px;z-index:20;display:flex;align-items:center;gap:4px;padding:6px 10px;background:rgba(8,20,36,.88);border:1px solid rgba(95,214,240,.28);border-radius:24px;backdrop-filter:blur(10px);overflow-x:auto}
.bar-btn{font-size:12px;color:#7fa8c4;cursor:pointer;padding:5px 10px;border-radius:14px;white-space:nowrap;border:1px solid transparent;flex-shrink:0}
.bar-btn:active{background:rgba(95,214,240,.15)}
.bar-play{width:36px;height:36px;border-radius:50%;border:none;background:linear-gradient(135deg,#2aa9c8,#1c7fa0);color:#fff;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar-play:active{transform:scale(.92)}
.bar-earth{color:#5fd6f0;font-weight:600;text-decoration:none;border:1px solid rgba(95,214,240,.4);border-radius:14px}
.bar-sep{width:1px;height:18px;background:rgba(95,214,240,.15);flex-shrink:0}
.bar-date{flex:1;font-size:12px;font-weight:700;color:#eaf6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;cursor:pointer;border-radius:12px;padding:4px 8px;background:rgba(95,214,240,.06)}
.bar-spd{font-size:11px;color:#bfe4f5;border:1px solid rgba(95,214,240,.3);border-radius:14px;padding:5px 10px;background:rgba(10,24,42,.5);cursor:pointer;white-space:nowrap;flex-shrink:0}
.bar-feat{height:28px;border-radius:14px;border:1px solid rgba(95,214,240,.25);background:rgba(10,24,42,.45);color:#7fa8c4;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0 8px;white-space:nowrap;gap:2px}
.bar-feat:active{background:rgba(95,214,240,.18);color:#5fd6f0}
.spd-popup{display:none;position:fixed;z-index:25;background:rgba(10,20,38,.96);border:1px solid rgba(95,214,240,.5);border-radius:12px;padding:8px 10px;max-width:90vw}
.spd-popup .row{display:flex;gap:6px}
.spd-opt{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid rgba(95,214,240,.3);background:rgba(10,24,42,.55);color:#dff0fb;cursor:pointer}
.spd-opt.on{background:linear-gradient(90deg,#5fd6f0,#2aa9c8);color:#04121c;border-color:transparent}
.tz-opt{padding:8px 14px;border-radius:8px;font-size:12px;color:#bfe4f5;cursor:pointer;border:1px solid transparent}
.tz-opt:hover,.tz-opt.on{background:rgba(95,214,240,.12);border-color:rgba(95,214,240,.3);color:#5fd6f0}
.dp-lunar{font-size:9px;color:rgba(255,210,74,.7);margin-top:1px}
/* 日期选择器 */
.dp-tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:600;color:#6a8ea8;cursor:pointer;border-bottom:2px solid transparent}
.dp-tab.active{color:#5fd6f0;border-bottom-color:#5fd6f0}
.dp-nav{width:32px;height:32px;border-radius:50%;border:1px solid rgba(95,214,240,.3);color:#5fd6f0;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(10,24,42,.5)}
.dp-cell{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#bfe4f5;cursor:pointer}
.dp-cell:hover{background:rgba(95,214,240,.12)}
.dp-cell.today{border:1px solid #5fd6f0;color:#5fd6f0}
.dp-cell.selected{background:linear-gradient(135deg,#5fd6f0,#2aa9c8);color:#04121c;font-weight:700}
.dp-cell.other{color:#3a5a70}
.dp-cell.head{color:#5a7a94;font-size:11px;font-weight:600;cursor:default}
.dp-select{flex:1;font-size:12px;color:#bfe4f5;border:1px solid rgba(95,214,240,.3);border-radius:6px;padding:5px;background:rgba(10,24,42,.6)}
.dp-btn{flex:1;text-align:center;padding:12px;font-size:13px;font-weight:600;cursor:pointer}
.spds{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}


/* ===== 信息卡弹窗 ===== */
.card-mask{position:fixed;inset:0;z-index:50;background:rgba(2,5,12,.5);display:flex;align-items:center;justify-content:center}
.card{width:78vw;max-width:320px;border-radius:8px;padding:14px 16px;background:rgba(8,20,36,.95);border:1px solid rgba(95,214,240,.7);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card .hdr{display:flex;align-items:center;margin-bottom:8px}
.card .hdr .bar{width:3px;height:16px;background:#5fd6f0;box-shadow:0 0 8px #5fd6f0;border-radius:2px;margin-right:8px}
.card .hdr .bar.gold{background:#f5c451;box-shadow:0 0 8px #f5c451}
.card .hdr .title{font-size:17px;font-weight:800;color:#fff;flex:1}
.card .hdr .close{color:#7fa8c4;font-size:20px;cursor:pointer;padding:0 4px}
.card .row{display:flex;justify-content:space-between;font-size:12.5px;color:#7fa8c4;padding:4px 0;border-bottom:1px solid rgba(95,214,240,.08)}
.card .row .val{color:#dff0fb}
.card .note{margin-top:8px;font-size:12px;color:#cfe4f2;line-height:1.6;background:rgba(95,214,240,.06);border:1px solid rgba(95,214,240,.18);border-radius:4px;padding:8px}

/* ===== 操作引导 ===== */
.guide-overlay{position:fixed;inset:0;z-index:60;background:rgba(2,6,16,.72)}
.guide-hl{position:fixed;z-index:61;border:2px solid rgba(95,214,240,.85);border-radius:12px;box-shadow:0 0 24px rgba(95,214,240,.45);pointer-events:none;animation:gpulse 2s ease-in-out infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 24px rgba(95,214,240,.45)}50%{box-shadow:0 0 32px rgba(95,214,240,.65)}}
.guide-hl-dial{left:50%;top:36%;width:56vw;height:56vw;max-width:280px;max-height:280px;transform:translate(-50%,-50%);border-radius:50%}
.guide-card{position:fixed;left:50%;transform:translateX(-50%);z-index:62;width:280px;background:rgba(8,20,36,.96);border:1px solid rgba(95,214,240,.65);border-radius:10px;padding:16px 18px 12px}
.guide-card .title{font-size:17px;font-weight:800;color:#eaf6ff;margin-bottom:8px}
.guide-card .desc{font-size:13px;line-height:1.75;color:#bfe4f5;white-space:pre-line}
.guide-card .row{display:flex;align-items:center;margin-top:14px}
.guide-card .skip{font-size:12px;color:#6a8ea8;cursor:pointer}
.guide-card .dots{flex:1;display:flex;justify-content:center;gap:6px}
.guide-card .dot{width:6px;height:6px;border-radius:50%;background:rgba(95,214,240,.25)}
.guide-card .dot.on{background:#5fd6f0;box-shadow:0 0 6px rgba(95,214,240,.7)}
.guide-card .nav{display:flex;align-items:center;gap:8px}
.guide-card .prev{font-size:12px;color:#7fa8c4;cursor:pointer}
.guide-card .next{font-size:13px;font-weight:700;color:#04121c;background:linear-gradient(90deg,#5fd6f0,#2aa9c8);padding:6px 14px;border-radius:14px;cursor:pointer}

/* ===== 命理/历法报告 ===== */
.fort-mask{position:fixed;inset:0;z-index:50;background:rgba(2,5,12,.5);display:flex;align-items:center;justify-content:center}
.fort-card{width:85vw;max-width:400px;max-height:78vh;border-radius:10px;padding:14px 16px;background:rgba(8,20,36,.95);border:1px solid rgba(180,140,230,.6);display:flex;flex-direction:column}
.fort-card .hdr{display:flex;align-items:center;margin-bottom:8px}
.fort-card .hdr .bar{width:3px;height:16px;background:#f5c451;border-radius:2px;margin-right:8px}
.fort-card .hdr .title{font-size:17px;font-weight:800;color:#fff;flex:1}
.fort-card .hdr .close{color:#7fa8c4;font-size:20px;cursor:pointer}
.fort-body{flex:1;overflow-y:auto;margin-top:6px}
.fort-text{font-size:13px;line-height:1.85;color:#d8e8f6;white-space:pre-wrap;word-break:break-word}
.fort-loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:55;display:flex;flex-direction:column;align-items:center;gap:14px}
.fort-spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(180,140,230,.2);border-top-color:#b48ce6;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fort-ltxt{font-size:14px;color:#d4a0ff;letter-spacing:3px}

/* ===== 星空旅行 HUD ===== */
.voy-hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.voy-hud>*{pointer-events:auto}
.voy-top{position:absolute;top:env(safe-area-inset-top);left:14px;display:flex;align-items:center;gap:9px}
.voy-ava{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(120,230,255,.7);background:rgba(8,24,44,.6);display:flex;align-items:center;justify-content:center;font-size:20px}
.voy-meta .nick{font-size:14px;font-weight:800;color:#eaf9ff;text-shadow:0 0 10px rgba(95,214,240,.6);letter-spacing:1px}
.voy-meta .mis{font-size:11px;color:#7fe6ff;letter-spacing:1px}
.voy-dest{position:absolute;top:calc(env(safe-area-inset-top) + 44px);left:14px;padding:5px 12px;border-radius:16px;font-size:12px;color:#bfeeff;border:1px solid rgba(120,230,255,.45);background:rgba(8,22,40,.55);cursor:pointer}
.voy-pass{position:absolute;top:calc(env(safe-area-inset-top) + 80px);left:0;right:0;text-align:center}
.voy-pass .lab{font-size:10px;color:#6fd0ee;letter-spacing:3px}
.voy-pass .txt{font-size:13px;font-weight:700;color:#d8f6ff;text-shadow:0 0 10px rgba(95,214,240,.6);margin-top:2px}
.voy-stat{position:absolute;bottom:calc(90px + env(safe-area-inset-bottom));pointer-events:none}
.voy-stat .lab{font-size:10px;color:#6fd0ee;letter-spacing:2px}
.voy-stat .val{font-size:18px;font-weight:800;color:#d8f6ff;text-shadow:0 0 12px rgba(95,214,240,.7)}
.voy-stat.sl{left:16px;text-align:left}
.voy-stat.sr{right:16px;text-align:right}
.voy-stat.sc{left:0;right:0;text-align:center}
.voy-ctrl{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:14px}
.voy-btn{min-width:76px;text-align:center;padding:11px 0;border-radius:26px;color:#bfeeff;font-size:14px;font-weight:700;letter-spacing:3px;border:1px solid rgba(120,230,255,.5);background:rgba(8,24,46,.5);cursor:pointer}
.voy-btn.cr{min-width:92px;background:linear-gradient(180deg,#aef0ff,#4fc8ee);color:#051322;border-color:#aef0ff}
.voy-exit{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:14px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(120,230,255,.45);background:rgba(8,22,40,.5);color:#bfecff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.voy-destpicker{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:14px;padding:5px 12px;border-radius:16px;font-size:12px;color:#bfeeff;border:1px solid rgba(120,230,255,.45);background:rgba(8,22,40,.55);cursor:pointer}
.voy-labels{position:absolute;inset:0;pointer-events:none}
.voy-label{position:absolute;transform:translate(-50%,-150%);font-size:11px;color:#cdeeff;white-space:nowrap;padding:1px 6px;border-radius:8px;background:rgba(6,16,32,.5);border:1px solid rgba(120,230,255,.28)}
</style>
</head>
<body>

<!-- 2D 画布（地球表盘） -->
<canvas id="cv"></canvas>
<canvas id="gl"></canvas>

<!-- 顶部栏 -->
<div class="topbar" id="topbar">
  <span class="brand">时间景观</span>
  <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
    <a href="solar-system.html" style="font-size:11px;color:#5fd6f0;text-decoration:none;padding:4px 10px;border:1px solid rgba(95,214,240,.4);border-radius:12px">☀ 太阳系</a>
  </div>
</div>

<!-- 地球信息条 -->
<div class="einfo" id="einfo">
  <span class="ei2" id="eiTerm"></span>
</div>

<!-- 底部浮动操作栏 -->
<div class="bottombar" id="bottombar">
  <a href="solar-system.html?from=earth" class="bar-btn bar-earth">☀ 太阳系</a>
  <div class="bar-date" id="dateText"></div>
  <div class="bar-btn" id="tzBtn">🕓 UTC+8</div>
  <div class="bar-sep"></div>
  <div class="bar-btn" id="pPrev">‹‹</div>
  <div class="bar-btn" id="pSlow">◀◀</div>
  <div class="bar-play" id="pPlay">❚❚</div>
  <div class="bar-btn" id="pFast">▶▶</div>
  <div class="bar-btn" id="pNext">››</div>
  <div class="bar-btn" id="pNow" style="color:#f5c451">现在</div>
  <div class="bar-sep"></div>
  <div class="bar-spd" id="spdBtn">⚡ 秒/秒 ▾</div>
  <div class="bar-sep"></div>
  <div class="bar-feat" id="btnHemi">🧭 北</div>
  <div class="bar-feat" id="btnCities" style="color:#5fd6f0">🏙 城市</div>
  <div class="bar-feat" id="btnSkin">🌐 卫星</div>
  <div class="bar-feat" id="btnFortune">✨ 历法</div>
  <div class="bar-feat" id="btnGuide">❓ 引导</div>
</div>

<!-- 时区选择弹窗 -->
<div id="tzPopup" style="display:none;position:fixed;z-index:25;background:rgba(10,20,38,.96);border:1px solid rgba(95,214,240,.5);border-radius:12px;padding:8px 10px;max-width:80vw">
  <div id="tzOptions" style="display:flex;flex-direction:column;gap:4px"></div>
</div>

<!-- 速度选择弹窗 -->
<div id="spdPopup" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:25;background:rgba(10,20,38,.96);border:1px solid rgba(95,214,240,.5);border-radius:12px;padding:8px 10px">
  <div style="display:flex;gap:6px">
    <div class="spd-opt" data-u="sec">秒/秒</div><div class="spd-opt" data-u="hour">时/秒</div>
    <div class="spd-opt" data-u="day">日/秒</div><div class="spd-opt" data-u="month">月/秒</div><div class="spd-opt" data-u="year">年/秒</div>
  </div>
</div>

<!-- 地图风格选择弹窗 -->
<div id="skinPopup" style="display:none;position:fixed;z-index:25;background:rgba(10,20,38,.96);border:1px solid rgba(95,214,240,.5);border-radius:12px;padding:8px 10px">
  <div style="display:flex;gap:6px">
    <div class="spd-opt skin-opt" data-skin="satellite">卫星</div>
    <div class="spd-opt skin-opt" data-skin="admin">行政</div>
    <div class="spd-opt skin-opt" data-skin="cartoon">卡通</div>
  </div>
</div>

<!-- 日期选择器弹窗 -->
<div id="datePicker" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:30;background:rgba(8,20,36,.97);border:1px solid rgba(95,214,240,.5);border-radius:16px;padding:0;min-width:300px;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,.6);overflow:hidden">
  <div style="display:flex;border-bottom:1px solid rgba(95,214,240,.15)">
    <div id="tabSolar" class="dp-tab active" onclick="switchCalTab('solar')">公历</div>
    <div id="tabLunar" class="dp-tab" onclick="switchCalTab('lunar')">农历</div>
  </div>
  <div id="solarPanel" style="padding:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="dp-nav" onclick="dpNav(-1)">‹</div>
      <div style="display:flex;gap:6px;align-items:center"><select id="dpYear" style="font-size:13px;color:#eaf6ff;background:rgba(10,24,42,.6);border:1px solid rgba(95,214,240,.3);border-radius:6px;padding:3px 6px"></select><span id="dpTitle" style="font-size:15px;font-weight:700;color:#eaf6ff"></span></div>
      <div class="dp-nav" onclick="dpNav(1)">›</div>
    </div>
    <div id="dpGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center"></div>
    <div style="display:flex;gap:6px;margin-top:12px;align-items:center;justify-content:center">
      <span style="font-size:12px;color:#5a7a94">时间</span>
      <input type="time" id="dpTime" value="12:00" step="1" style="font-size:13px;color:#bfe4f5;border:1px solid rgba(95,214,240,.3);border-radius:8px;padding:5px 8px;background:rgba(10,24,42,.6);width:90px">
    </div>
  </div>
  <div id="lunarPanel" style="display:none;padding:12px">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <select id="lunarYear" class="dp-select"></select>
      <select id="lunarMonth" class="dp-select"></select>
      <select id="lunarDay" class="dp-select"></select>
      <select id="lunarHour" class="dp-select"></select>
    </div>
    <div id="lunarInfo" style="font-size:12px;color:#9fc6dd;text-align:center;min-height:40px"></div>
  </div>
  <div style="display:flex;border-top:1px solid rgba(95,214,240,.15)">
    <div id="dpCancel" class="dp-btn" style="color:#6a8ea8">取消</div>
    <div id="dpToday" class="dp-btn" style="color:#5fd6f0;border-radius:0 0 16px 16px">今天</div>
  </div>
</div>

<!-- 过场动画 -->
<canvas id="transCanvas" style="position:fixed;inset:0;z-index:100;pointer-events:none;display:none"></canvas>

<!-- 信息卡 -->
<div class="card-mask" id="cardMask" style="display:none">
  <div class="card" id="card">
    <div class="hdr"><span class="bar" id="cardBar"></span><span class="title" id="cardTitle"></span><span class="close" id="cardClose">×</span></div>
    <div id="cardBody"></div>
  </div>
</div>

<!-- 命理报告 -->
<div class="fort-mask" id="fortMask" style="display:none">
  <div class="fort-card">
    <div class="hdr"><span class="bar gold"></span><span class="title">🔮 解读星空历法</span><span class="close" id="fortClose">×</span></div>
    <div class="fort-body"><div class="fort-text" id="fortText"></div></div>
  </div>
</div>
<div class="fort-loading" id="fortLoading" style="display:none">
  <div class="fort-spin"></div>
  <div class="fort-ltxt">天机推演中…</div>
</div>

<!-- 操作引导 -->
<div class="guide-overlay" id="guideOverlay" style="display:none"></div>
<div class="guide-card" id="guideCard" style="display:none">
  <div class="title" id="guideTitle"></div>
  <div class="desc" id="guideDesc"></div>
  <div class="row">
    <span class="skip" id="guideSkip">跳过</span>
    <div class="dots" id="guideDots"></div>

function sunLon(d) {

    // 标签（沿径向向圆心内移，tier 错开防重叠）
    ctx.font = (c.star ? 'bold ' : '') + '13px sans-serif';
    const tw = ctx.measureText(c.cn).width;
    const tier = c.tier || 0;
    let labelR = dotR - (10 + tier * 12);
    const maxR = R * 0.93 - tw / 2;
    if (labelR > maxR) labelR = maxR;
    if (labelR < R * 0.26) labelR = R * 0.26;
    const lx = cx + sinA * labelR, ly = cy - cosA * labelR;
    // 引线
    if (Math.hypot(lx - px, ly - py) > 6) {
      ctx.strokeStyle = 'rgba(255,210,74,.45)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(lx, ly); ctx.stroke();
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(6,14,30,.72)'; ctx.fillRect(lx - tw / 2 - 3, ly - 6, tw + 6, 12);
    ctx.fillStyle = c.star ? '#ffd7d3' : (night ? 'rgba(226,234,246,.95)' : '#fff7e0');
    ctx.fillText(c.cn, lx, ly);
    ctx.globalAlpha = 1;
  }
  }

  // 中央时钟表盘
  const rc = R * EARTH_CFG.clockScale;
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, rc, 0, 7); ctx.fillStyle = 'rgba(247,250,255,.92)'; ctx.fill();
  ctx.strokeStyle = 'rgba(60,90,120,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * Math.PI; ctx.strokeStyle = 'rgba(40,60,90,.5)'; ctx.lineWidth = i % 3 === 0 ? 1.5 : 0.7; ctx.beginPath(); ctx.moveTo(Math.sin(a) * rc * 0.82, -Math.cos(a) * rc * 0.82); ctx.lineTo(Math.sin(a) * rc * 0.95, -Math.cos(a) * rc * 0.95); ctx.stroke(); }
  ctx.fillStyle = 'rgba(28,43,68,.9)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.max(7, Math.round(rc * 0.34)) + 'px sans-serif';
  ctx.fillText(p2(date.getUTCMonth() + 1) + '.' + p2(date.getUTCDate()), 0, rc * 0.45);
  const minu = date.getUTCMinutes() + date.getUTCSeconds() / 60;
  const sec = date.getUTCSeconds() + date.getUTCMilliseconds() / 1000;
  let a = minu / 60 * 2 * Math.PI; ctx.strokeStyle = '#1c2b44'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a) * rc * 0.6, -Math.cos(a) * rc * 0.6); ctx.stroke();
  a = sec / 60 * 2 * Math.PI; ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-Math.sin(a) * rc * 0.12, Math.cos(a) * rc * 0.12); ctx.lineTo(Math.sin(a) * rc * 0.78, -Math.cos(a) * rc * 0.78); ctx.stroke();
  ctx.fillStyle = '#1c2b44'; ctx.beginPath(); ctx.arc(0, 0, rc * 0.07, 0, 7); ctx.fill();
  ctx.restore();

  // 月球
  const Or = R * EARTH_CFG.moonOrbitScale, ma = ph.el * RAD, mx = cx - Math.sin(ma) * Or, my = cy - Math.cos(ma) * Or, mr = EARTH_CFG.moonSize;
  const cAng = Math.atan2(cy - my, cx - mx), sAng = Math.atan2(sy - my, sx - mx);
  const adist = (a, b) => { let dd = Math.abs((a - b) % (2 * Math.PI)); return dd > Math.PI ? 2 * Math.PI - dd : dd; };
  const t1 = cAng - Math.PI / 2, t2 = cAng + Math.PI / 2;
  const mrot = adist(t1, sAng) <= adist(t2, sAng) ? t1 : t2;
  drawMoonLit(mx, my, mr, ph.illum, mrot);
  window._moonXY = { x: mx, y: my, r: mr };
}

function lunarLeapDays(y){return lunarLeap(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
function lunarMonthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function lunarYearDays(y){var s=348;for(var i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+lunarLeapDays(y);}

function solarToLunar(y,m,d){
  var off=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  var year=1900,leap=0;
  for(var i=1900;i<2101&&off>0;i++){var dy=lunarYearDays(i);off-=dy;}
  if(off<0){off+=lunarYearDays(--i);}
  year=i;leap=lunarLeap(year);
  var isLeap=false,month=1;
  for(var j=1;j<13&&off>0;j++){
    var dm=lunarMonthDays(year,j);
    if(j===leap){dm=lunarLeapDays(year);}
    off-=dm;month=j;
  }
  if(off<0){off+=dm;}
  var mStr=['\u6b63','\u4e8c','\u4e09','\u56db','\u4e94','\u516d','\u4e03','\u516b','\u4e5d','\u5341','\u51ac','\u814a'];

  return {year:year,month:month,day:off+1,isLeap:isLeap,monthName:mStr[month-1]+'\u6708',dayName:dStr[off]};
}

const AU_LY = 1 / 63241.1;

let voyage = null, _voyState = 'orbit', _destDist = 0, _distLy = 0, _speedC = 0, _maxC = 0, _missionY = 0;
let _destIdx = 3, _warpIdx = 0;
const WLV = [2.635e-5, 1e-4, 5e-4, 0.002, 0.01, 0.05, 0.2, 0.5, 1, 2, 3, 5, 10, 30, 100, 300, 1000, 10000, 100000, 1000000];

function enterVoyage() {
  state.view = 'voyage';
  ensureRenderer();
  document.getElementById('gl').classList.add('show');
  document.getElementById('cv').style.display = 'none';
  document.getElementById('voyHud').style.display = '';
  if (!voyage) initVoyageScene();
  setupVoyRoute();
}
function exitVoyage() {
  document.getElementById('voyHud').style.display = 'none';
  document.getElementById('gl').classList.remove('show');
  document.getElementById('cv').style.display = '';

}

function initVoyageScene() {
  // 复用已有 renderer/scene/cam 但创建旅行专用场景
  voyage = { scene: new THREE.Scene(), cam: new THREE.PerspectiveCamera(70, W / H, 0.1, 9000), waypoints: [] };
  voyage.scene.background = new THREE.Color(0x03050c);
  voyage.scene.add(new THREE.AmbientLight(0x96a4c0, 0.75));
  const key = new THREE.PointLight(0xdfe9ff, 1.4, 0, 0.12); key.position.set(30, 20, 40); voyage.scene.add(key);
  // 星空
  const p = [], c = [];
  for (let i = 0; i < 2400; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * 6.283, s = Math.sqrt(1 - u * u), R = 3400;
    p.push(s * Math.cos(th) * R, u * R, s * Math.sin(th) * R);
    const t = Math.random(); const b = 0.45 + Math.random() * 0.55;
    c.push((t < 0.25 ? 0.72 : t > 0.85 ? 1 : 1) * b, (t < 0.25 ? 0.8 : t > 0.85 ? 0.84 : 1) * b, (t < 0.25 ? 1 : t > 0.85 ? 0.64 : 1) * b);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  voyage.scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending })));
  // 目的地选择器
  const destEl = document.getElementById('voyDest');
  COS_DEST.forEach((d, i) => { const o = document.createElement('option'); o.value = i; o.textContent = d.name + ' · ' + (d.kind === 'planet' ? (d.dist / AU_LY < 1 ? (d.dist / AU_LY).toFixed(2) + ' AU' : d.dist + ' ly') : d.dist + ' ly'); destEl.appendChild(o); });
  destEl.value = _destIdx;
  destEl.onchange = () => { _destIdx = +destEl.value; setupVoyRoute(); };
}

function setupVoyRoute() {
  const dest = COS_DEST[_destIdx];
  _destDist = dest.dist;
  _voyState = 'orbit'; _distLy = 0; _speedC = 0; _maxC = 0; _missionY = 0; _warpIdx = 0;
  document.getElementById('voyMis').textContent = '⌖ 前往 ' + dest.name;
  document.getElementById('voyGo').textContent = '出发';
  document.getElementById('voyPass').textContent = '地球轨道 · 待命';
  document.getElementById('voySpeed').textContent = '0 km/s';
  document.getElementById('voyDist').textContent = '0 AU';
  document.getElementById('voyEta').textContent = '—';
}

function updateVoyage(dt, now) {
  if (_voyState === 'run') {
    const target = WLV[_warpIdx] || 0;
    _speedC += (target - _speedC) * Math.min(1, dt * 1.1);
    const dMY = dt * 10 / 365.25;
    _missionY += dMY;
    _distLy += _speedC * dMY;
    if (_speedC > _maxC) _maxC = _speedC;
    if (_distLy >= _destDist) { _distLy = _destDist; _voyState = 'arrived'; }
  }
  // 渲染
  renderer.render(voyage.scene, voyage.cam);
  // HUD
  if (now - (updateVoyage._hudT || 0) > 300) {
    updateVoyage._hudT = now;
    document.getElementById('voySpeed').textContent = _speedC < 0.01 ? (_speedC * 299792).toFixed(0) + ' km/s' : _speedC.toFixed(2) + ' c';
    document.getElementById('voyDist').textContent = _distLy < 0.02 ? (_distLy / AU_LY).toFixed(2) + ' AU' : _distLy.toFixed(2) + ' ly';
    document.getElementById('voyEta').textContent = _voyState === 'arrived' ? '已抵达' : _speedC > 1e-9 ? fmtTime(_destDist - _distLy, _speedC) : '—';
    document.getElementById('voyPass').textContent = _voyState === 'arrived' ? '已抵达 ' + COS_DEST[_destIdx].name : '— 星际空间 —';
    document.getElementById('voyGo').textContent = _voyState === 'orbit' ? '出发' : _voyState === 'run' ? '暂停' : _voyState === 'pause' ? '继续' : '已抵达';
  }
}
function fmtTime(remLy, speedC) {
  const y = remLy / speedC;
  if (y < 1) return Math.round(y * 365) + ' 天';
  if (y < 100) return y.toFixed(1) + ' 年';
  return Math.round(y) + ' 年';
}

document.getElementById('voyGo').onclick = () => {
  if (_voyState === 'orbit') { _voyState = 'run'; _speedC = WLV[0]; }
  else if (_voyState === 'run') _voyState = 'pause';
  else if (_voyState === 'pause') _voyState = 'run';
};
document.getElementById('voySlow').onclick = () => { _warpIdx = Math.max(0, _warpIdx - 1); };
document.getElementById('voyFast').onclick = () => { _warpIdx = Math.min(WLV.length - 1, _warpIdx + 1); };
document.getElementById('voyExit').onclick = () => exitVoyage();

// ========== 触摸交互 ==========
let drag = null, pinch = null;
function onTouchStart(e) {
  e.preventDefault && e.preventDefault();
  if (e.touches.length >= 2) {
    const a = { x: e.touches[0].clientX, y: e.touches[0].clientY }, b = { x: e.touches[1].clientX, y: e.touches[1].clientY };
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    drag = null; return;
  }
  const t = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  drag = { x: t.x, y: t.y, moved: 0 };
}
function onTouchMove(e) {
  e.preventDefault && e.preventDefault();
  if (pinch && e.touches.length >= 2) {
    const a = { x: e.touches[0].clientX, y: e.touches[0].clientY }, b = { x: e.touches[1].clientX, y: e.touches[1].clientY };
    const dd = Math.hypot(a.x - b.x, a.y - b.y);
    return;
  }
  if (!drag || !e.touches.length) return;
  const p = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  const dx = p.x - drag.x, dy = p.y - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));

  if (state.view === 'earth') { state.t -= dx * 1800000; drag.x = p.x; return; }
  drag.x = p.x; drag.y = p.y;
}
function onTouchEnd(e) {
  if (pinch && (!e.touches || e.touches.length < 2)) pinch = null;
  drag = null;
}

// 鼠标事件适配器
function mouseToTouch(e) { return { clientX: e.clientX, clientY: e.clientY }; }
function onMouseDown(e) { onTouchStart({ touches: [mouseToTouch(e)] }); }
function onMouseMove(e) { if (drag) { onTouchMove({ touches: [mouseToTouch(e)] }); e.preventDefault(); } }
function onMouseUp(e) { onTouchEnd({ touches: [] }); }
function onWheel(e) {
  e.preventDefault();
  earthZoom = Math.max(0.5, Math.min(4, earthZoom * (e.deltaY > 0 ? 0.92 : 1.08)));
}
document.addEventListener('touchstart', onTouchStart, { passive: false });
document.addEventListener('touchmove', onTouchMove, { passive: false });
document.addEventListener('touchend', onTouchEnd, { passive: true });
document.addEventListener('mousedown', onMouseDown);
document.addEventListener('mousemove', onMouseMove);
document.addEventListener('mouseup', onMouseUp);
document.addEventListener('wheel', onWheel, { passive: false });

// ========== 命理/历法 ==========
const API_URL = location.origin + location.pathname.replace(/[^/]*$/, '') + 'api/fortune';
let _fortBuf = '', _fortFlushed = '', _fortTimer = null;

function flushFort(force) {
  if (_fortBuf === _fortFlushed && !force) return;
  _fortFlushed = _fortBuf;
  document.getElementById('fortText').textContent = _fortBuf;
  document.getElementById('fortLoading').style.display = 'none';
  document.getElementById('fortMask').style.display = 'flex';
}

function startFortune() {
  const d = dnum(dispT), date = new Date(dispT + tz.min * 60000);
  const _fl = solarToLunar(date.getUTCFullYear(), date.getUTCMonth()+1, date.getUTCDate());
  const ph = moonPhase(d, _fl ? _fl.day : null), st = solarTerm(d);
  _fortBuf = ''; _fortFlushed = '';
  document.getElementById('fortText').textContent = '';
  document.getElementById('fortLoading').style.display = 'flex';
  document.getElementById('fortMask').style.display = 'none';
  if (_fortTimer) clearInterval(_fortTimer);
  _fortTimer = setInterval(() => flushFort(), 90);

  const data = {
    dateText: date.getUTCFullYear() + '-' + p2(date.getUTCMonth() + 1) + '-' + p2(date.getUTCDate()) + ' ' + p2(date.getUTCHours()) + ':' + p2(date.getUTCMinutes()),
    lunar: gzYear(date.getUTCFullYear()) + '年',
    shichen: '', yearGZ: gzYear(date.getUTCFullYear()),
    solarTerm: st.name, termToNext: st.toNext,
    moonPhase: ph.name, moonAge: ph.age.toFixed(1), moonIllum: Math.round(ph.illum * 100),
    zodiac: '', sunLon: sunLon(d).toFixed(1), mode: 'almanac'
  };

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data })
  }).then(async r => {
    if (!r.body || !r.body.getReader) { const t = await r.text(); _fortBuf = t; flushFort(true); return; }
    const reader = r.body.getReader(), decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const text = decoder.decode(value, { stream: true });
      text.split('\n').forEach(line => {
        if (!line.startsWith('data:')) return;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') return;
        try { const j = JSON.parse(payload); if (j.content) _fortBuf += j.content; } catch (e) {}
      });
    }
    flushFort(true);
    if (_fortTimer) { clearInterval(_fortTimer); _fortTimer = null; }
  }).catch(e => { _fortBuf = '⚠️ ' + e.message; flushFort(true); });
}

// ===== 过场动画：地球→太阳系 =====
function transitionToSolar(href) {
  const tc = document.getElementById('transCanvas');
  if (!tc) { location.href = href; return; }
  const tctx = tc.getContext('2d');
  const DPR2 = Math.min(window.devicePixelRatio || 1, 2);
  tc.width = W * DPR2; tc.height = H * DPR2;
  tc.style.width = W + 'px'; tc.style.height = H + 'px';
  tctx.setTransform(DPR2, 0, 0, DPR2, 0, 0);
  tc.style.display = 'block';

  const ex = W / 2, ey = H * EARTH_CFG.centerY;
  const eR = Math.min(W, H) * EARTH_CFG.earthScale;
  const targetX = W / 2, targetY = H / 2;
  const south = state.hemi < 0;
  const eimg = getEarthImg();
  const imgOk = isEarthReady();

  let startTime = null, duration = 900;

  function animate(ts) {
    if (!startTime) startTime = ts;
    const progress = Math.min((ts - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);

    tctx.clearRect(0, 0, W, H);
    tctx.fillStyle = 'rgba(3,5,12,' + ease + ')';
    tctx.fillRect(0, 0, W, H);

    const cx = ex + (targetX - ex) * ease;
    const cy = ey + (targetY - ey) * ease;
    const scale = 1 - ease * 0.93;
    const r = eR * scale;

    if (r > 1) {
      // 画真实地球图片（从 Image 对象直接画，不经过 canvas 截图）
      tctx.save();
      tctx.beginPath(); tctx.arc(cx, cy, r, 0, Math.PI * 2); tctx.clip();
      if (imgOk) {
        tctx.drawImage(eimg, cx - r, cy - r, r * 2, r * 2);
      } else {
        tctx.fillStyle = '#1a4a7a'; tctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      }
      tctx.restore();
      tctx.strokeStyle = 'rgba(95,214,240,.3)'; tctx.lineWidth = 1;
      tctx.beginPath(); tctx.arc(cx, cy, r, 0, Math.PI * 2); tctx.stroke();
    }

    if (progress < 1) requestAnimationFrame(animate);
    else location.href = href;
  }
  requestAnimationFrame(animate);
}

// 绑定跳转链接为动画触发
document.querySelectorAll('a[href*="solar-system"]').forEach(el => {
  el.addEventListener('click', function(e) {
    e.preventDefault();
    transitionToSolar(this.href);
  });
