为了看清两种轨道，双星和比邻星分别加速展示，不能用画面中的快慢比较真实公转速度。外轨道距离经过压缩；轨道方向与起点用于教学，不对应日期栏中的实时位置。<br><br>
小说《三体》设定了复杂的恒星运动与气候变化。真实的南门二系统具有相隔很远的内外轨道，不能把三颗恒星的运动简单画成随意摆动。</div>
