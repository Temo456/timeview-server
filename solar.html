<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>时间景观 · 太阳系</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#03050c;font-family:-apple-system,"PingFang SC",sans-serif;color:#c8daf0;-webkit-font-smoothing:antialiased}
canvas{display:block;width:100%;height:100%}
.plab{position:absolute;transform:translate(-50%,-100%);z-index:5;background:rgba(7,18,34,.78);border:1px solid rgba(95,214,240,.3);border-radius:3px;padding:3px 7px;font-size:11px;color:#eaf6ff;white-space:nowrap;pointer-events:none}
.plab .nm{font-weight:700}.plab .au{color:#5fd6f0;margin-left:5px;font-size:10px}
.plab::before{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:rgba(95,214,240,.3)}
.slab{position:absolute;transform:translate(-50%,-50%);font-size:9px;color:rgba(255,210,74,.6);pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.9);letter-spacing:1px;white-space:nowrap;z-index:4}
.slab-m{font-size:11px;color:#ffd24a;font-weight:700}
.slab-c{font-size:12px;color:#5fd6f0;font-weight:800;text-shadow:0 0 10px rgba(95,214,240,.7)}
.slab-d{width:4px;height:4px;border-radius:50%;background:rgba(255,210,74,.45);font-size:0}
.axlabel{position:absolute;font-size:11px;font-weight:700;pointer-events:none;text-shadow:0 0 4px rgba(0,0,0,.8);z-index:6}
.ctrl{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.ctrl button{min-width:36px;height:30px;border-radius:6px;border:1px solid rgba(95,214,240,.3);background:rgba(8,20,36,.7);color:#7fa8c4;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrl button:active{background:rgba(95,214,240,.2)}
.ctrl button.on{color:#5fd6f0;border-color:rgba(95,214,240,.6)}
.card-mask{position:fixed;inset:0;z-index:20;background:rgba(2,5,12,.5);display:flex;align-items:center;justify-content:center}
.card{width:78vw;max-width:300px;border-radius:8px;padding:14px 16px;background:rgba(8,20,36,.95);border:1px solid rgba(95,214,240,.7);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card .hdr{display:flex;align-items:center;margin-bottom:8px}
.card .hdr .bar{width:3px;height:16px;background:#f5c451;border-radius:2px;margin-right:8px}
.card .hdr .title{font-size:17px;font-weight:800;color:#fff;flex:1}
.card .hdr .close{color:#7fa8c4;font-size:20px;cursor:pointer;padding:0 4px}
.card .row{display:flex;justify-content:space-between;font-size:12.5px;color:#7fa8c4;padding:4px 0;border-bottom:1px solid rgba(95,214,240,.08)}
.card .row .v{color:#dff0fb}
.god-banner{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10;background:linear-gradient(90deg,rgba(245,196,81,.15),rgba(95,214,240,.15));border:1px solid rgba(245,196,81,.55);border-radius:16px;padding:6px 16px;font-size:13px;font-weight:700;color:#ffe7a8;display:none;pointer-events:none;white-space:nowrap;box-shadow:0 0 20px rgba(245,196,81,.25)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="god-banner" id="godBanner"></div>
<div id="labels"></div>
<div class="ctrl">
  <button id="bTop" title="季节俯视">⊕</button>
  <button id="bReset" title="45°视角">⌖</button>
  <button id="bGod" title="上帝俯视">👁</button>
  <button id="bLabels" class="on" title="行星标签">🏷</button>
  <button id="bOrbit" class="on" title="轨道线">◷</button>
</div>
<div class="card-mask" id="cardMask" style="display:none">
  <div class="card">
    <div class="hdr"><span class="bar" id="cardBar"></span><span class="title" id="cardTitle"></span><span class="close" id="cardClose">×</span></div>
    <div id="cardBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RAD = Math.PI / 180;
const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
const rev = x => { x %= 360; return x < 0 ? x + 360 : x; };
const dnum = ms => (ms - J2000) / 86400e3;

// ===== 天文算法 =====
function sunLon(d) {
  d += 1.5; const w = 282.9404 + 4.70935e-5 * d, e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.0470 + 0.9856002585 * d), Mr = M * RAD;
  const E = M + (e / RAD) * Math.sin(Mr) * (1 + e * Math.cos(Mr)), Er = E * RAD;
  return rev(Math.atan2(Math.sqrt(1 - e * e) * Math.sin(Er), Math.cos(Er) - e) / RAD + w);
}
function moonPhase(d) {
  d += 1.5; const N = rev(125.1228 - 0.0529538083 * d), e = 0.0549;
  const M = rev(115.3654 + 13.0649929509 * d), Mr = M * RAD;
  let E = M + (e / RAD) * Math.sin(Mr);
  for (let k = 0; k < 4; k++) { const Er = E * RAD; E = E - (E - (e / RAD) * Math.sin(Er) - M) / (1 - e * Math.cos(Er)); }
  const Er = E * RAD, xv = Math.cos(Er) - e, yv = Math.sqrt(1 - e * e) * Math.sin(Er);
  const v = Math.atan2(yv, xv) / RAD, w = rev(318.0634 + 0.1643573223 * d);
  const el = rev(v + w - sunLon(dnum(d * 86400e3 / 86400e3 + J2000)));
  return rev(v + w);
}
const TERMS = ['春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒','立春','雨水','惊蛰'];
function solarTerm(d) {
  const SL = rev(sunLon(d)), i = Math.floor(SL / 15) % 24;
  return { name: TERMS[i], idx: i, next: TERMS[(i + 1) % 24] };
}

// ===== 行星数据 =====
const PLANETS = [
  { n:'水星', a:0.387, sz:1.8, dia:'4,879 km', temp:'-173~427°C', type:'类地行星', moons:'0', P:0.241, rot:58.6, tex:'mercury' },
  { n:'金星', a:0.723, sz:2.4, dia:'12,104 km', temp:'462°C', type:'类地行星', moons:'0', P:0.615, rot:-243, tex:'venus' },
  { n:'地球', a:1.000, sz:2.6, dia:'12,742 km', temp:'15°C', type:'类地行星', moons:'1', P:1.000, rot:1.0, tex:'earth' },
  { n:'火星', a:1.524, sz:2.0, dia:'6,779 km', temp:'-63°C', type:'类地行星', moons:'2', P:1.881, rot:1.03, tex:'mars' },
  { n:'木星', a:5.203, sz:6.0, dia:'139,820 km', temp:'-108°C', type:'气态巨行星', moons:'95', P:11.86, rot:0.41, tex:'jupiter' },
  { n:'土星', a:9.537, sz:5.2, dia:'116,460 km', temp:'-139°C', type:'气态巨行星', moons:'146', P:29.46, rot:0.44, tex:'saturn' },
  { n:'天王星', a:19.19, sz:3.8, dia:'50,724 km', temp:'-197°C', type:'冰巨星', moons:'28', P:84.01, rot:-0.72, tex:'uranus' },
  { n:'海王星', a:30.07, sz:3.6, dia:'49,244 km', temp:'-201°C', type:'冰巨星', moons:'16', P:164.8, rot:0.67, tex:'neptune' },
  { n:'冥王星', a:39.48, sz:1.2, dia:'2,377 km', temp:'-230°C', type:'矮行星', moons:'5', P:248.0, rot:6.39, tex:'pluto' }
];
const PLANET_EN = {'水星':'Mercury','金星':'Venus','地球':'Earth','火星':'Mars','木星':'Jupiter','土星':'Saturn','天王星':'Uranus','海王星':'Neptune','冥王星':'Pluto'};

function SCALE(a) { return 8 + Math.pow(a, 0.55) * 28; }
function planetLon(p, d) { return rev(360 * d / (p.P * 365.25)); }

// ===== 状态 =====
let W = 0, H = 0, DPR = 1;
let renderer, scene, cam, raycaster, sunMesh, sunGlow, fillLight;
let planetMeshes = [], planetGroups = [], labelsOn = true, orbitOn = true;
let dispT = Date.now();
let camS = { r: 200, th: 0, ph: 0.01, tr: 200, tth: 0, tph: 0.01 };
let drag = null, pinch = null, inertia = 0, scrubVel = 0;

// ===== 贴图加载 =====
const TEXBASE = 'https://timeview.site/timeview/textures/';
function loadPlanetTex(mat, filename) {
  const url = TEXBASE + filename;
  fetch(url).then(r => r.blob()).then(blob => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const tex = new THREE.Texture(img);
          tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
          tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
          tex.needsUpdate = true;
          mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true;
        } catch (e) {}
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(blob);
  }).catch(() => {});
}

// ===== 3D 初始化 =====
function initThree() {
  const gl = document.getElementById('gl');
  renderer = new THREE.WebGL1Renderer({ canvas: gl, antialias: true, alpha: false });
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03050c);
  cam = new THREE.PerspectiveCamera(H > W ? 62 : 50, W / H, 0.1, 5000);
  cam.up.set(0, 1, 0);
  cam.position.set(0, 0, 200);

  // 灯光
  scene.add(new THREE.AmbientLight(0x96a4c0, 0.75));
  fillLight = new THREE.PointLight(0xdfe9ff, 1.4, 0, 0.12);
  scene.add(fillLight);

  // 星空
  const starGeo = new THREE.BufferGeometry();
  const sp = [], sc = [];
  for (let i = 0; i < 3000; i++) {
    sp.push((Math.random() - 0.5) * 4000, (Math.random() - 0.5) * 4000, (Math.random() - 0.5) * 4000);
    const b = 0.4 + Math.random() * 0.6; sc.push(b, b, b);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(sc, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true, sizeAttenuation: false })));

  // 太阳
  const sunGeo = new THREE.SphereGeometry(5.5, 48, 48);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
  sunMesh = new THREE.Mesh(sunGeo, sunMat); scene.add(sunMesh);
  loadPlanetTex(sunMat, 'sun.jpg');
  // 光晕
  const gs = 128, gd = new Uint8Array(gs * gs * 4);
  for (let y = 0; y < gs; y++) for (let x = 0; x < gs; x++) {
    const dx = x - gs / 2, dy = y - gs / 2, d = Math.sqrt(dx * dx + dy * dy) / (gs / 2);
    const alpha = d < 0.3 ? 1 : d < 0.7 ? 1 - (d - 0.3) / 0.4 : 0;
    const idx = (y * gs + x) * 4;
    gd[idx] = 255; gd[idx + 1] = 220; gd[idx + 2] = 100; gd[idx + 3] = Math.round(alpha * 255);
  }
  const gt = new THREE.DataTexture(gd, gs, gs, THREE.RGBAFormat); gt.needsUpdate = true;
  sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: gt, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  sunGlow.scale.set(36, 36, 1); scene.add(sunGlow);

  // 行星
  PLANETS.forEach((p, i) => {
    const geo = new THREE.SphereGeometry(p.sz, 36, 36);
    const mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8, metalness: 0.1 });
    loadPlanetTex(mat, p.tex + '.jpg');
    const mesh = new THREE.Mesh(geo, mat); mesh.userData = p;
    const grp = new THREE.Group(); grp.add(mesh); scene.add(grp);
    planetMeshes.push(mesh); planetGroups.push(grp);
    // 轨道线
    const orbR = SCALE(p.a);
    const orbGeo = new THREE.BufferGeometry().setFromPoints(
      Array.from({ length: 129 }, (_, k) => { const a = k / 128 * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * orbR, Math.sin(a) * orbR, 0); })
    );
    scene.add(new THREE.Line(orbGeo, new THREE.LineBasicMaterial({ color: 0x1a3050, transparent: true, opacity: 0.5 })));
  });

  // 24 节气
  const eR = SCALE(1);
  window._seasonPts = [];
  for (let i = 0; i < 24; i++) {
    const a = i * 15 * RAD;
    window._seasonPts.push({ x: Math.cos(a) * eR, y: Math.sin(a) * eR, z: 0, name: TERMS[i], idx: i });
  }

  // 坐标轴（双向延伸，以太阳为原点）
  const axLen = 999;
  const axMats = [
    new THREE.LineBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.5 }),
    new THREE.LineBasicMaterial({ color: 0x44ff44, transparent: true, opacity: 0.5 }),
    new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.5 })
  ];
  const axDirs = [[axLen, 0, 0], [0, axLen, 0], [0, 0, axLen]];
  const axNames = ['X·春分', 'Y·夏至', 'Z·北极'];
  const labelsEl = document.getElementById('labels');
  window._axLabels = []; window._axDirs = axDirs;
  axDirs.forEach((dir, i) => {
    // 正方向线
    const geo1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(...dir)]);
    scene.add(new THREE.Line(geo1, axMats[i]));
    // 负方向线（虚线效果：用透明度较低的线）
    const negDir = dir.map(v => -v);
    const geo2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(...negDir)]);
    scene.add(new THREE.Line(geo2, new THREE.LineBasicMaterial({ color: axMats[i].color.getHex(), transparent: true, opacity: 0.25 })));
    // 轴末端标签（只标注正方向）
    const lbl = document.createElement('div');
    lbl.className = 'axlabel';
    lbl.style.color = ['#ff6666', '#66ff66', '#6688ff'][i];
    lbl.textContent = axNames[i];
    labelsEl.appendChild(lbl);
    window._axLabels.push(lbl);
  });
  // 原点标记（小球体，便于识别中心）
  const originGeo = new THREE.SphereGeometry(0.8, 12, 12);
  const originMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  scene.add(new THREE.Mesh(originGeo, originMat));

  // 创建行星标签
  window._plabEls = [];
  PLANETS.forEach((p, i) => {
    const el = document.createElement('div'); el.className = 'plab'; el.id = 'plab' + i;
    el.innerHTML = '<span class="nm">' + p.n + '</span><span class="au">' + p.a.toFixed(2) + ' AU</span>';
    labelsEl.appendChild(el); window._plabEls.push(el);
  });

  // 节气标签
  window._slabEls = [];
  window._seasonPts.forEach((sp, i) => {
    const el = document.createElement('div'); el.id = 'slab' + i;
    labelsEl.appendChild(el); window._slabEls.push(el);
  });

  raycaster = new THREE.Raycaster();
}

// ===== 投影 =====
const _v = new THREE.Vector3();
function project(v3) {
  _v.copy(v3).project(cam);
  return { x: (_v.x * 0.5 + 0.5) * W, y: (-_v.y * 0.5 + 0.5) * H, vis: _v.z < 1 };
}

// ===== 更新太阳系 =====
function updateSolar(d, dt) {
  // 行星位置（XY平面）
  for (let i = 0; i < PLANETS.length; i++) {
    const p = PLANETS[i], R = SCALE(p.a), a = planetLon(p, d) * RAD;
    planetGroups[i].position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
    planetMeshes[i].rotation.z = ((d / p.rot) % 1) * 2 * Math.PI;
  }
  sunMesh.rotation.y += 0.15 * dt;
  const pu = 1 + Math.sin(Date.now() / 600) * 0.04;
  sunGlow.scale.set(22 * pu, 22 * pu, 1);

  // 相机
  camS.r += (camS.tr - camS.r) * 0.12;
  camS.th += (camS.tth - camS.th) * 0.12;
  camS.ph += (camS.tph - camS.ph) * 0.12;
  cam.up.set(0, 1, 0);
  const sp = Math.sin(camS.ph);
  cam.position.set(camS.r * sp * Math.sin(camS.th), camS.r * sp * Math.cos(camS.th), camS.r * Math.cos(camS.ph));
  cam.lookAt(0, 0, 0);
  fillLight.position.copy(cam.position);

  renderer.render(scene, cam);

  // 行星标签
  PLANETS.forEach((p, i) => {
    const el = window._plabEls[i];
    if (!labelsOn) { el.style.display = 'none'; return; }
    const s = project(planetGroups[i].position);
    if (s.vis && s.x > 0 && s.x < W) { el.style.display = ''; el.style.left = s.x + 'px'; el.style.top = (s.y - 20) + 'px'; }
    else el.style.display = 'none';
  });

  // 节气标签
  const curTerm = solarTerm(d).idx;
  window._seasonPts.forEach((sp, i) => {
    const el = window._slabEls[i];
    if (!orbitOn) { el.style.display = 'none'; return; }
    const s = project(sp);
    if (!s.vis || s.x < 10 || s.x > W - 10) { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
    const major = [0, 6, 12, 18].includes(sp.idx);
    const isCur = sp.idx === curTerm;
    el.className = isCur ? 'slab slab-c' : major ? 'slab slab-m' : 'slab slab-d';
    el.textContent = isCur || major ? sp.name : '';
  });

  // 坐标轴标签
  window._axLabels.forEach((el, i) => {
    const s = project(new THREE.Vector3(...window._axDirs[i]));
    if (s.vis) { el.style.display = ''; el.style.left = s.x + 'px'; el.style.top = s.y + 'px'; }
    else el.style.display = 'none';
  });
}

// ===== 渲染循环 =====
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  if (inertia && !drag) { dispT += inertia * dt; inertia *= Math.exp(-1.4 * dt); if (Math.abs(inertia) < 1000) inertia = 0; }
  else { dispT += (Date.now() - dispT) * 0.05; }
  const d = dnum(dispT);
  updateSolar(d, dt);
}

// ===== 拾取 =====
function pickPlanet(px, py) {
  let best = -1, bd = 1e9;
  PLANETS.forEach((p, i) => {
    const s = project(planetGroups[i].position); if (!s.vis) return;
    const dd = Math.hypot(s.x - px, s.y - py), tol = Math.max(30, p.sz * 14);
    if (dd < tol && dd < bd) { bd = dd; best = i; }
  });
  return best;
}

// ===== 触摸 =====
function onTouchStart(e) {
  e.preventDefault && e.preventDefault();
  if (e.touches && e.touches.length >= 2) {
    const a = { x: e.touches[0].clientX, y: e.touches[0].clientY }, b = { x: e.touches[1].clientX, y: e.touches[1].clientY };
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: camS.tr };
    drag = null; return;
  }
  const t = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
  drag = { x: t.x, y: t.y, moved: 0, pl: null, lastT: Date.now() };
  const idx = pickPlanet(t.x, t.y);
  if (idx >= 0) {
    drag.pl = idx;
    document.getElementById('godBanner').textContent = '✋ 上帝之手 · 拖动「' + PLANETS[idx].n + '」';
    document.getElementById('godBanner').style.display = 'block';
    try { navigator.vibrate(15); } catch (e) {}
  }
}
function onTouchMove(e) {
  e.preventDefault && e.preventDefault();
  if (pinch && e.touches && e.touches.length >= 2) {
    const a = { x: e.touches[0].clientX, y: e.touches[0].clientY }, b = { x: e.touches[1].clientX, y: e.touches[1].clientY };
    const dd = Math.hypot(a.x - b.x, a.y - b.y);
    if (dd > 0) camS.tr = Math.max(30, Math.min(340, pinch.r * pinch.d / dd));
    return;
  }
  const t = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
  if (!drag) return;
  const dx = t.x - drag.x, dy = t.y - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));

  if (drag.pl !== null) {
    // 上帝之手：以屏幕中心为参考，计算手指角度变化 → 行星沿轨道移动
    const prevAngle = Math.atan2(drag.y - H / 2, drag.x - W / 2);
    const currAngle = Math.atan2(t.y - H / 2, t.x - W / 2);
    let dA = prevAngle - currAngle;
    while (dA > Math.PI) dA -= 2 * Math.PI;
    while (dA < -Math.PI) dA += 2 * Math.PI;
    const pl = PLANETS[drag.pl];
    const timeMs = dA * (pl.P * 365.25 / 360) * 86400e3;
    dispT += timeMs;
    const now = Date.now();
    scrubVel = timeMs / Math.max((now - drag.lastT) / 1000, 0.001);
    drag.lastT = now; drag.x = t.x; drag.y = t.y;
    return;
  }
  // 拖空白 = 旋转场景（无限制，自由3D视角）
  camS.tth -= dx * 0.008;
  camS.tph += dy * 0.008;
  drag.x = t.x; drag.y = t.y;
}
function onTouchEnd(e) {
  if (pinch && (!e.touches || e.touches.length < 2)) pinch = null;
  if (drag) {
    if (drag.pl !== null && drag.moved < 8) showPlanetCard(drag.pl);
    else if (drag.pl !== null && drag.moved >= 8) { inertia = scrubVel; }
    document.getElementById('godBanner').style.display = 'none';
  }
  drag = null; scrubVel = 0;
}

// ===== 信息卡 =====
function showPlanetCard(idx) {
  const p = PLANETS[idx]; if (!p) return;
  const d = dnum(dispT);
  document.getElementById('cardTitle').textContent = p.n;
  document.getElementById('cardBody').innerHTML =
    '<div class="row"><span>距离</span><span class="v">' + p.a + ' AU</span></div>' +
    '<div class="row"><span>直径</span><span class="v">' + p.dia + '</span></div>' +
    '<div class="row"><span>温度</span><span class="v">' + p.temp + '</span></div>' +
    '<div class="row"><span>类型</span><span class="v">' + p.type + '</span></div>' +
    '<div class="row"><span>卫星</span><span class="v">' + p.moons + '</span></div>' +
    '<div class="row"><span>黄经</span><span class="v">' + planetLon(p, d).toFixed(1) + '°</span></div>';
  document.getElementById('cardMask').style.display = 'flex';
}

// ===== 初始化 =====
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  if (renderer && cam) { renderer.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix(); }
}
window.addEventListener('resize', resize);
resize();
initThree();

// 事件绑定
const gl = document.getElementById('gl');
gl.addEventListener('touchstart', onTouchStart, { passive: false });
gl.addEventListener('touchmove', onTouchMove, { passive: false });
gl.addEventListener('touchend', onTouchEnd, { passive: true });
gl.addEventListener('mousedown', onTouchStart);
gl.addEventListener('mousemove', e => { if (drag) onTouchMove(e); });
gl.addEventListener('mouseup', onTouchEnd);
gl.addEventListener('wheel', e => { e.preventDefault(); camS.tr = Math.max(30, Math.min(340, camS.tr * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });

document.getElementById('cardClose').onclick = () => document.getElementById('cardMask').style.display = 'none';
document.getElementById('cardMask').onclick = function(e) { if (e.target === this) this.style.display = 'none'; };

// 控制按钮
document.getElementById('bTop').onclick = () => { camS.tr = 200; camS.tth = 0; camS.tph = 0.01; };
document.getElementById('bReset').onclick = () => { camS.tr = 200; camS.tth = 3 * Math.PI / 4; camS.tph = 0.8; };
document.getElementById('bGod').onclick = () => { camS.tr = 400; camS.tth = 0; camS.tph = 0.01; };
document.getElementById('bLabels').onclick = function() { labelsOn = !labelsOn; this.classList.toggle('on', labelsOn); };
document.getElementById('bOrbit').onclick = function() {
  orbitOn = !orbitOn; this.classList.toggle('on', orbitOn);
  scene.children.forEach(c => { if (c instanceof THREE.Line && c.material.color.getHex() === 0x1a3050) c.visible = orbitOn; });
};

requestAnimationFrame(frame);
</script>
</body>
</html>
