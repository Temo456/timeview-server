# 你已经配置好了。作为对照，/timeview 反代到本机 8766，并去掉前缀（proxy_pass 末尾带 /）：
#
#   location /timeview/ {
#       proxy_pass http://127.0.0.1:8766/;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_set_header Connection '';   # 保持到上游的长连接
#       proxy_read_timeout 120s;   # 给 AI 回答留足时间
#       # —— SSE 流式必需：关闭缓冲，否则命理推演会一次性返回、看不到逐字效果 ——
#       proxy_buffering off;
#       proxy_cache off;
#       chunked_transfer_encoding on;
#       gzip off;                  # 不要对 event-stream 压缩
#   }
#
# 说明：server.js 已对 /api/fortune 返回 X-Accel-Buffering: no，
#       多数情况下无需改 nginx 即可流式；若仍不流式，再补上上面 4 行。
#   # 可选：自动补斜杠，便于相对路径
#   location = /timeview { return 301 /timeview/; }
#
# 应用已做子路径适配（注入 <base href="/timeview/">，前端用相对路径），无需改 nginx 其它部分。
